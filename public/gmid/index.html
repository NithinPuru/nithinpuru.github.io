<title>gm/ID Explorer — Open PDK Hub</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0e11;
    --surface:   #111518;
    --surface2:  #161c24;
    --border:    #1e2530;
    --muted:     #3a4352;
    --text:      #c8d6e5;
    --text-dim:  #6b7a8d;

    --ihp-hue:  #00c8ff;
    --sky-hue:  #4de88a;
    --gf-hue:   #ff8c42;

    --bar-h: 52px;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--qt-serif); }

  /* ── TOP BAR ─────────────────────────────────────────────── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: var(--bar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 16px;
    gap: 0;
  }

  #wordmark {
    font-family: var(--qt-mono);
    font-size: 12.5px; font-weight: 600; letter-spacing: .09em;
    color: var(--text); white-space: nowrap; margin-right: 18px; flex-shrink: 0;
  }
  #wordmark span { color: var(--text-dim); font-weight: 400; }

  .vdiv { width: 1px; height: 20px; background: var(--border); margin: 0 12px; flex-shrink: 0; }

  #tabs { display: flex; align-items: center; gap: 4px; }

  .tab {
    position: relative;
    display: flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 13px;
    border-radius: 5px; border: 1px solid transparent;
    cursor: pointer;
    font-family: var(--qt-mono);
    font-size: 11px; font-weight: 500; letter-spacing: .05em;
    color: var(--text-dim); background: transparent;
    transition: background .14s, border-color .14s, color .14s;
    white-space: nowrap; user-select: none;
  }
  .tab:hover { background: var(--qt-raise); color: var(--text); border-color: var(--muted); }
  .tab.active { color: var(--text); border-color: var(--muted); background: var(--qt-well); }
  .tab.active::after {
    content: ''; position: absolute; bottom: -1px; left: 4px; right: 4px;
    height: 2px; border-radius: 2px 2px 0 0;
  }

  /* per-PDK colours */
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: box-shadow .2s; }
  .tab[data-pdk="ihp"]  .dot { background: var(--ihp-hue); }
  .tab[data-pdk="sky"]  .dot { background: var(--sky-hue); }
  .tab[data-pdk="gf"]   .dot { background: var(--gf-hue);  }

  .tab.active[data-pdk="ihp"]  { border-color: color-mix(in srgb, var(--ihp-hue) 35%, var(--border)); }
  .tab.active[data-pdk="ihp"]::after { background: var(--ihp-hue); }
  .tab.active[data-pdk="ihp"]  .dot  { box-shadow: 0 0 5px 2px color-mix(in srgb, var(--ihp-hue) 55%, transparent); }

  .tab.active[data-pdk="sky"]  { border-color: color-mix(in srgb, var(--sky-hue) 35%, var(--border)); }
  .tab.active[data-pdk="sky"]::after { background: var(--sky-hue); }
  .tab.active[data-pdk="sky"]  .dot  { box-shadow: 0 0 5px 2px color-mix(in srgb, var(--sky-hue) 55%, transparent); }

  .tab.active[data-pdk="gf"]   { border-color: color-mix(in srgb, var(--gf-hue) 35%, var(--border)); }
  .tab.active[data-pdk="gf"]::after  { background: var(--gf-hue); }
  .tab.active[data-pdk="gf"]   .dot  { box-shadow: 0 0 5px 2px color-mix(in srgb, var(--gf-hue) 55%, transparent); }

  .badge {
    font-size: 9px; font-family: var(--qt-mono);
    padding: 1px 5px; border-radius: 3px;
    background: var(--muted); color: var(--text-dim); letter-spacing: .02em;
  }
  .tab.active[data-pdk="ihp"] .badge { background: color-mix(in srgb, var(--ihp-hue) 15%, #111); color: var(--ihp-hue); }
  .tab.active[data-pdk="sky"] .badge { background: color-mix(in srgb, var(--sky-hue) 15%, #111); color: var(--sky-hue); }
  .tab.active[data-pdk="gf"]  .badge { background: color-mix(in srgb, var(--gf-hue)  15%, #111); color: var(--gf-hue);  }

  /* right side */
  #info-pill {
    margin-left: auto; flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--qt-mono); font-size: 10px; color: var(--text-dim);
    letter-spacing: .04em;
  }
  #corner-label { opacity: .7; }
  #info-pill a {
    color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px;
    transition: color .14s, border-color .14s;
  }
  #info-pill a:hover { color: var(--text); border-color: var(--muted); }

  /* theme-injection status chip */
  #theme-chip {
    display: flex; align-items: center; gap: 5px;
    font-family: var(--qt-mono); font-size: 9px;
    padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border);
    color: var(--text-dim); opacity: 0; transition: opacity .3s;
    white-space: nowrap;
  }
  #theme-chip.visible { opacity: 1; }
  #theme-chip .chip-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* ── IFRAME LAYER ─────────────────────────────────────────── */
  #frames {
    position: fixed;
    top: var(--bar-h); left: 0; right: 0; bottom: 0;
  }

  .wrap {
    position: absolute; inset: 0;
    display: none; background: var(--bg);
  }
  .wrap.active { display: block; }

  .loading {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: var(--bg); transition: opacity .4s;
  }
  .loading.gone { opacity: 0; pointer-events: none; }

  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--border);
    animation: spin .65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: var(--qt-mono);
    font-size: 10.5px; letter-spacing: .1em; color: var(--text-dim);
  }

  .wrap iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  @media (max-width: 600px) {
    #wordmark, .vdiv { display: none; }
    .badge { display: none; }
    #info-pill { display: none; }
    .tab { padding: 0 10px; }
  }

#gm-theme { display: inline-flex; align-items: center; gap: 6px; font: 400 13px/1 var(--qt-serif); color: var(--qt-ink-2); padding: 6px 10px; border-radius: 7px; border: 1px solid var(--qt-rule-strong); background: var(--qt-card); cursor: pointer; }
#gm-theme:hover { color: var(--qt-accent); border-color: var(--qt-accent); }
.gm-home { margin-right: 14px; }
#tabs .badge { background: var(--qt-well) !important; color: var(--qt-ink-3) !important; border: 1px solid var(--qt-rule); }
#tabs .tab.active .badge { background: var(--qt-accent-wash) !important; color: var(--qt-accent) !important; border-color: transparent; }
/* gmid theme: map this tool's variables onto the shared tokens */
:root, :root[data-theme] { --bg: var(--qt-page); --surface: var(--qt-card); --surface2: var(--qt-well); --border: var(--qt-rule); --muted: var(--qt-ink-4); --text: var(--qt-ink); --text-dim: var(--qt-ink-3); --ihp-hue: var(--qt-accent); --sky-hue: var(--qt-up); --gf-hue: var(--qt-warn); }
body { font-family: var(--qt-serif); }

  font-family: 'IBM Plex Mono', monospace !important;
  font-size: 10.5px !important;
  border-radius: 4px !important;
  box-shadow: 0 4px 12px rgba(0,0,0,.5) !important;
}

/* Ensure Plotly paper/plot bg stays transparent/dark */
.bg, .plotbg { fill: #0b0e11 !important; }
`;
}

/* ──────────────────────────────────────────────────────────────
   State
────────────────────────────────────────────────────────────── */
const iframeMap  = {};   // key → HTMLIFrameElement
const loadedMap  = {};   // key → bool (iframe injected)
const themedMap  = {};   // key → bool (CSS injected)

/* ──────────────────────────────────────────────────────────────
   Theme injection
────────────────────────────────────────────────────────────── */
function injectTheme(key) {
  const cfg = PDKS[key];
  if (!cfg.injectTheme || themedMap[key]) return;

  const frame = iframeMap[key];
  if (!frame) return;

  let doc;
  try { doc = frame.contentDocument || frame.contentWindow.document; }
  catch(e) { console.warn(`Theme inject: cross-origin guard hit for ${key}`, e); return; }

  if (!doc || !doc.head) return;

  /* remove any existing light-mode or conflicting stylesheets */
  Array.from(doc.querySelectorAll('link[rel="stylesheet"]')).forEach(l => {
    const href = l.href || '';
    /* Keep Plotly and Google Fonts; remove any other third-party theme */
    if (!href.includes('plotly') && !href.includes('fonts.googleapis') &&
        !href.includes('fonts.gstatic') && href !== '') {
      l.disabled = true;
    }
  });

  const style = doc.createElement('style');
  style.id    = 'ihp-hub-theme';
  style.textContent = buildThemeCSS(cfg.accent);
  doc.head.appendChild(style);
  themedMap[key] = true;

  showChip(cfg.accent);
}

/* ──────────────────────────────────────────────────────────────
   Chip indicator
────────────────────────────────────────────────────────────── */
let chipTimeout;
function showChip(accent) {
  const chip = document.getElementById('theme-chip');
  const dot  = document.getElementById('chip-dot');
  clearTimeout(chipTimeout);
  dot.style.background = accent;
  chip.classList.add('visible');
  chipTimeout = setTimeout(() => chip.classList.remove('visible'), 3500);
}

/* ──────────────────────────────────────────────────────────────
   Iframe creation
────────────────────────────────────────────────────────────── */
function createIframe(key) {
  if (loadedMap[key]) return;
  loadedMap[key] = true;

  const cfg    = PDKS[key];
  const wrap   = document.getElementById(cfg.wrap);
  const loading= document.getElementById(cfg.load);

  const frame = document.createElement('iframe');
  frame.src   = cfg.url;
  frame.title = `gm/ID Explorer — ${key.toUpperCase()}`;
  frame.setAttribute('loading', 'eager');
  frame.setAttribute('allow', 'fullscreen');
  iframeMap[key] = frame;

  frame.addEventListener('load', () => {
    /* slight delay so Plotly has rendered before we paint over */
    setTimeout(() => {
      if (cfg.injectTheme) injectTheme(key);
      loading.classList.add('gone');
    }, 600);
  });

  wrap.appendChild(frame);
}

/* ──────────────────────────────────────────────────────────────
   Tab switching
────────────────────────────────────────────────────────────── */
function switchTab(tabEl) {
  const key = tabEl.dataset.pdk;
  const cfg = PDKS[key];

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');

  document.querySelectorAll('.wrap').forEach(w => w.classList.remove('active'));
  document.getElementById(cfg.wrap).classList.add('active');

  document.getElementById('corner-label').textContent = cfg.corner;
  document.getElementById('gh-link').href = cfg.ghUrl;

  createIframe(key);

  /* If already themed, briefly flash chip to confirm */
  if (themedMap[key]) showChip(cfg.accent);
}

/* ──────────────────────────────────────────────────────────────
   Init — load IHP immediately
────────────────────────────────────────────────────────────── */
createIframe('ihp');

/* Keyboard: 1/2/3 to switch tabs */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = { '1':'ihp', '2':'sky', '3':'gf' }[e.key];
  if (k) switchTab(document.querySelector(`.tab[data-pdk="${k}"]`));
});
</script>
</body>
</html>
