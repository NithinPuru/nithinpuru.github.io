<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
<link rel="preload" href="/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Secure sensor chip + PUF: see the idea run</title>
<meta name="description" content="An interactive, animated model of a secure delta-sigma sensor chip, and a proposal to make its key unstealable by regenerating it from the chip's own fingerprint.">
<style>
@font-face{font-family:"KaTeX_Main";src:url("/fonts/KaTeX_Main-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"KaTeX_Main";src:url("/fonts/KaTeX_Main-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"KaTeX_Main";src:url("/fonts/KaTeX_Main-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"KaTeX_Typewriter";src:url("/fonts/KaTeX_Typewriter-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* Palette shared with the other nithinpuru.github.io tools (Quant Terminal family, see /fx-quant/, /deadline/);
   light/dark follows html[data-theme] and localStorage "theme". */
:root,:root[data-theme="light"]{
  color-scheme:light;
  --ink:#131c28; --ink-soft:#3d4756; --ink-faint:#5b6676; --on-ink:#ffffff;
  --paper:#f4f6f9; --panel:#ffffff; --panel-2:#f8f9fb; --line:rgba(19,28,40,.16); --line-soft:rgba(19,28,40,.09);
  --sig:#1f4fd1;        /* accent blue - analog signal path */
  --sig-dim:rgba(31,79,209,.45); --sig-bg:rgba(31,79,209,.06); --sig-bg2:rgba(31,79,209,.12);
  --key:#b42318;        /* red - key/security path */
  --key-dim:rgba(180,35,24,.45); --key-bg:rgba(180,35,24,.06); --key-bg2:rgba(180,35,24,.12);
  --warn:#b42318; --good:#077a5d; --good-bg:rgba(11,138,107,.1);
  --ink-bg:rgba(19,28,40,.07);
  --grid:rgba(19,28,40,.09);
  --code-bg:#131c28; --code-ink:#e6ebf2;
  --shadow:rgba(19,28,40,.45);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f2f5fa; --ink-soft:#cfd7e3; --ink-faint:#95a1b3; --on-ink:#0f1620;
  --paper:#0f1620; --panel:#172131; --panel-2:#131c2a; --line:rgba(242,245,250,.14); --line-soft:rgba(242,245,250,.08);
  --sig:#7aa7ff; --sig-dim:rgba(122,167,255,.45); --sig-bg:rgba(122,167,255,.08); --sig-bg2:rgba(122,167,255,.16);
  --key:#ff8a7a; --key-dim:rgba(255,138,122,.45); --key-bg:rgba(255,138,122,.08); --key-bg2:rgba(255,138,122,.16);
  --warn:#ff8a7a; --good:#4fd1a8; --good-bg:rgba(79,209,168,.12);
  --ink-bg:rgba(242,245,250,.08);
  --grid:rgba(242,245,250,.08);
  --code-bg:#0b111a; --code-ink:#dbe3ee;
  --shadow:rgba(0,0,0,.7);
}
:root{
  --mono:"KaTeX_Typewriter","Latin Modern Mono","Courier New",monospace;
  --sans:"KaTeX_Main","Latin Modern Roman",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--sig);color:var(--on-ink)}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
button,input,select{font:inherit}
h1,h2,h3{font-weight:700;letter-spacing:-0.01em;margin:0}
a{color:var(--sig)}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px 80px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
.hbar{max-width:1500px;margin:0 auto;padding:14px 20px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.hbar h1{font-size:19px}
.hbar .sub{color:var(--ink-soft);font-size:13.5px}
.scheme-toggle{margin-left:auto;display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.scheme-toggle button{border:0;background:var(--panel);color:var(--ink-soft);padding:7px 16px;font-family:var(--sans);
  font-size:13.5px;font-weight:400;cursor:pointer}
.scheme-toggle button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13.5px}
.theme-btn:hover{border-color:var(--sig);color:var(--sig)}
.theme-btn svg{width:15px;height:15px}
.hbar-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hbar-right .scheme-toggle{margin-left:0}

.layout{display:grid;grid-template-columns:288px 1fr;gap:24px;padding-top:22px}
@media(max-width:1080px){.layout{grid-template-columns:1fr}}

/* controls */
.controls{position:sticky;top:74px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.controls h3{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);
  margin:18px 0 10px;font-weight:700}
.controls h3:first-child{margin-top:0}
.ctl{margin-bottom:13px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
.ctl label b{color:var(--ink);font-family:var(--mono);font-weight:400;font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--sig);height:20px}
select,.seg{width:100%;font-family:var(--sans);font-size:13.5px;padding:7px 9px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper);color:var(--ink)}
.seg{display:flex;gap:4px;padding:4px;background:var(--paper)}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:6px;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;color:var(--ink-soft)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px var(--line);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;margin-bottom:9px}
.chk input{accent-color:var(--key);width:16px;height:16px}
.reset{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
  padding:8px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13px}
.hint{font-size:11.5px;color:var(--ink-faint);line-height:1.4;margin-top:3px}

/* verdict strip */
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.vcard .k{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint)}
.vcard .v{font-size:22px;font-weight:700;font-family:var(--mono);margin-top:3px;letter-spacing:-0.02em}
.vcard .d{font-size:12px;color:var(--ink-soft);margin-top:2px}
.v.good{color:var(--good)} .v.warn{color:var(--warn)}

/* pipeline diagram */
.stage-strip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 6px;margin-bottom:22px;overflow-x:auto}
.stage-strip .lane-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin:0 0 8px}
.lane{display:flex;align-items:stretch;gap:0;min-width:760px;margin-bottom:14px}
.node{position:relative;flex:1;min-width:84px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);
  padding:9px 8px;cursor:pointer;transition:border-color .12s,background .12s;text-align:center}
.node:hover{border-color:var(--sig-dim)}
.node[aria-selected=true]{border-color:var(--sig);background:var(--sig-bg);box-shadow:0 0 0 3px var(--sig-bg2)}
.node.key[aria-selected=true]{border-color:var(--key);background:var(--key-bg);box-shadow:0 0 0 3px var(--key-bg2)}
.node.key:hover{border-color:var(--key-dim)}
.node .nt{font-size:12.5px;font-weight:700;line-height:1.2}
.node .ns{font-size:10.5px;color:var(--ink-faint);margin-top:2px;font-family:var(--mono)}
.node.dim{opacity:.4}
.arrow{align-self:center;color:var(--ink-faint);flex:0 0 20px;text-align:center;font-size:15px}
.lane.keyflow .node{border-style:dashed}

/* main panels */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.panels{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
.panel.wide{grid-column:1/-1}
.panel h2{font-size:15px;margin-bottom:2px}
.panel .cap{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
.panel .cap b{color:var(--ink);font-weight:700}
canvas{width:100%;display:block;border-radius:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:9px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:14px;height:3px;border-radius:2px;display:inline-block}
.bitrow{font-family:var(--mono);font-size:12px;line-height:1.9;word-break:break-all;color:var(--ink-soft)}
.bitrow b{color:var(--ink)}
.explain{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--ink-soft)}
.explain b{color:var(--ink)}
.explain code{font-family:var(--mono);font-size:12.5px;background:var(--panel);padding:1px 5px;border-radius:4px;border:1px solid var(--line-soft)}
.tag{display:inline-block;font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:5px;margin-right:6px}
.tag.data{background:var(--sig-bg2);color:var(--sig)}
.tag.key{background:var(--key-bg2);color:var(--key)}
table.mini{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.mini td,table.mini th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line-soft)}
table.mini th{color:var(--ink-faint);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em}
table.mini td.n{font-family:var(--mono);text-align:right}
.pill{font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:700}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--key-bg2);color:var(--warn)}
.foot{margin-top:24px;font-size:12px;color:var(--ink-faint);line-height:1.6}
.foot .credit{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line-soft);font-size:13px;font-style:italic;color:var(--ink-soft)}

/* block info card */
#blockInfo{margin-bottom:18px}
details.info{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sig);border-radius:12px}
details.info.key{border-left-color:var(--key)}
details.info>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
details.info>summary::-webkit-details-marker{display:none}
details.info>summary::before{content:"\25B8";color:var(--ink-faint);display:inline-block;transition:transform .15s}
details.info[open]>summary::before{transform:rotate(90deg)}
details.info h2{font-size:17px;margin:0}
details.info .where{font-size:12.5px;color:var(--ink-faint)}
details.info .hide{margin-left:auto;font-size:12px;color:var(--ink-faint)}
details.info:not([open]) .hide::after{content:"show explanation"}
details.info[open] .hide::after{content:"hide"}
.info-body{padding:2px 18px 18px;display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
@media(max-width:900px){.info-body{grid-template-columns:1fr}}
.info-body h4{margin:0 0 5px;font-size:12.5px;color:var(--ink-faint);font-weight:700}
.info-body p{margin:0 0 14px;font-size:14px;color:var(--ink-soft)}
.info-body p.big{font-size:15.5px;color:var(--ink);line-height:1.55}
.info-body ul{margin:0 0 14px;padding-left:18px;font-size:13.5px;color:var(--ink-soft)}
.info-body li{margin-bottom:5px}
.io{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-bottom:14px}
.io .b{background:var(--paper);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.io .b b{color:var(--ink)}
.io .arr{align-self:center;color:var(--ink-faint)}
@media(max-width:560px){.io{grid-template-columns:1fr}.io .arr{transform:rotate(90deg);justify-self:center}}
pre.model{margin:0 0 14px;padding:11px 13px;background:var(--code-bg);color:var(--code-ink);border-radius:8px;font-family:var(--mono);
  font-size:12px;line-height:1.65;overflow-x:auto;white-space:pre}
details.gloss{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.gloss summary{cursor:pointer;font-weight:700;font-size:14px}
details.gloss dl{margin:12px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:13.5px;color:var(--ink-soft)}
details.gloss dt{font-weight:700;color:var(--ink)}
details.gloss dd{margin:0}
.scn-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.scn-btns button{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:7px 13px;
  border-radius:20px;cursor:pointer;font-family:var(--sans);font-size:12.5px}
.scn-btns button:hover{border-color:var(--sig);color:var(--sig)}

/* ---------------------------------------------------------------- story + caption */
.story{margin:18px 0 6px}
.scn-btns{margin-bottom:10px}
.caption{margin:0 0 18px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sig);
  border-radius:10px;font-size:15px;color:var(--ink);line-height:1.5;max-width:1100px}
.caption b{font-weight:700}
.scn-btns button[aria-pressed=true]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.hbar h1{font-size:20px}
.hbar .sub{max-width:640px}

/* ---------------------------------------------------------------- diagram card */
.diagram-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;margin-bottom:22px}
.dg-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.dg-head h2{font-size:17px}
.dg-head p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);max-width:560px}
.dg-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.tool{white-space:nowrap}
button.tool{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:400}
button.tool:hover{border-color:var(--sig);color:var(--sig)}
.speed{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.speed select{width:auto;padding:5px 8px}
.dg-scroll{overflow-x:auto}
svg.dg{display:block;width:100%;min-width:900px;height:auto}
.dg-legend{margin:6px 2px 2px}
.swatch.dashed{background:none;height:0;border-top:2px dashed;width:16px;border-radius:0}

/* svg parts */
svg.dg text{font-family:var(--sans)}
svg.dg .cont rect{fill:var(--panel-2);stroke:var(--line);stroke-width:1.2}
svg.dg .cont text{font-size:13px;font-weight:700;fill:var(--ink-faint)}
svg.dg .grp rect{fill:var(--sig-bg);stroke:var(--sig-dim);stroke-width:1.2;stroke-dasharray:5 4;cursor:pointer}
svg.dg .grp text{font-size:12px;fill:var(--sig)}
svg.dg .grp.alert rect{fill:var(--key-bg2);stroke:var(--key)}
svg.dg .grp.alert text{fill:var(--key);font-weight:700}
svg.dg .grp.sel rect{stroke-width:2.4}
svg.dg .lab{font-size:11.5px;fill:var(--ink-soft)}
svg.dg .lab.key{fill:var(--key)}
svg.dg .lab.strong{font-weight:700;fill:var(--ink)}
svg.dg .sign{font-size:12px;fill:var(--ink-faint);font-family:var(--mono)}

svg.dg .blk{cursor:pointer;outline:none}
svg.dg .blk rect,svg.dg .blk circle{fill:var(--panel);stroke-width:1.6;transition:fill .12s}
svg.dg .blk.an rect,svg.dg .blk.an circle{stroke:var(--sig)}
svg.dg .blk.dig rect,svg.dg .blk.dig circle{stroke:var(--ink)}
svg.dg .blk.key rect,svg.dg .blk.key circle{stroke:var(--key)}
svg.dg .blk .t{font-size:13px;font-weight:700;fill:var(--ink)}
svg.dg .blk .v{font-family:var(--mono);font-size:11px;fill:var(--ink-soft)}
svg.dg .blk .v.bad,svg.dg .blk .v.right.bad{fill:var(--warn);font-weight:700}
svg.dg .blk .glyph{font-size:17px;fill:var(--ink);font-weight:400}
svg.dg .blk.small .t{font-size:12px;font-weight:700}
svg.dg .blk:hover rect,svg.dg .blk:hover circle{fill:var(--sig-bg)}
svg.dg .blk.key:hover rect,svg.dg .blk.key:hover circle{fill:var(--key-bg)}
svg.dg .blk:focus-visible rect,svg.dg .blk:focus-visible circle{stroke-width:3.2}
svg.dg .blk.sel rect,svg.dg .blk.sel circle{fill:var(--sig-bg2);stroke-width:3.2}
svg.dg .blk.key.sel rect,svg.dg .blk.key.sel circle{fill:var(--key-bg2)}
svg.dg .blk.dig.sel rect,svg.dg .blk.dig.sel circle{fill:var(--ink-bg)}
svg.dg .sbg{fill:var(--paper)!important;stroke:var(--line-soft)!important;stroke-width:1!important}
svg.dg .scope{fill:none;stroke:var(--sig);stroke-width:1.4;stroke-linejoin:round}
svg.dg .blk.dig .scope{stroke:var(--ink)}
svg.dg .blk.key .scope,svg.dg .blk.eve .scope{stroke:var(--key)}
svg.dg .scope.thick{stroke-width:1.8}
svg.dg .cell{fill:var(--sig)}
svg.dg .cell.bad{fill:var(--warn)}
svg.dg .track{fill:var(--line-soft);stroke:none!important}
svg.dg .fill.ok{fill:var(--good)}
svg.dg .fill.bad{fill:var(--warn)}
svg.dg .half{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:2 2}
svg.dg .seg1,svg.dg .seg2,svg.dg .seg3{fill:var(--ink-faint)!important;stroke:none!important}
svg.dg .seg4{fill:var(--ink)!important;stroke:none!important}
svg.dg .badge{font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}

/* wires: dashes drift in the direction of flow */
svg.dg .wire{fill:none;stroke-width:1.8;stroke-linejoin:round}
svg.dg .wire.an{stroke:var(--sig)} svg.dg .wire.dg{stroke:var(--ink)} svg.dg .wire.ky{stroke:var(--key)}
svg.dg .wire.pub{stroke:var(--key);stroke-dasharray:6 5}
svg.dg .wire.ch{stroke:var(--ink-faint);stroke-width:2;stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
svg.dg .wire.tap{stroke-width:1.4;opacity:.7}
svg.dg .wire.an,svg.dg .wire.dg,svg.dg .wire.ky{stroke-dasharray:7 5;animation:flow .9s linear infinite}
svg.dg .wire.pub{animation:flow 1.4s linear infinite}
svg.dg.paused .wire{animation-play-state:paused}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){svg.dg .wire{animation:none!important}}
svg.dg .dot{fill:var(--ink)}
svg.dg .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
svg.dg .fbg{cursor:pointer}
svg.dg .fbg.sel .wire{stroke-width:3}
svg.dg g[data-node=channel].sel .wire,svg.dg g[data-node=fe].sel .wire{stroke-width:3}
@media(max-width:1080px){.scheme-toggle{margin-left:0}}

svg.dg .blk.eve .evebox{stroke:var(--key);stroke-dasharray:6 4;fill:var(--key-bg)}
svg.dg .blk.eve rect:not(.evebox){stroke-dasharray:none}
svg.dg .blk.eve rect.track{stroke:none}
svg.dg .newbox{fill:var(--key-bg);stroke:var(--key-dim);stroke-width:1.2;stroke-dasharray:5 4}
svg.dg .blk rect.cell{fill:var(--sig);stroke:none}
svg.dg .blk rect.cell.bad{fill:var(--warn)}
svg.dg .blk rect.track,svg.dg .blk rect.fill{stroke:none}

/* ---------------------------------------------------------------- small screens */
.layout>*{min-width:0}
@media(max-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .controls{position:static;max-height:none}
}
@media(max-width:560px){
  .wrap{padding:0 12px 60px}
  .hbar{padding:12px}
  .hbar .sub{font-size:12.5px}
  .caption{font-size:14px}
  .dg-tools{width:100%}
}
.info-body>*,.panels>*{min-width:0}

<script>
// ===== CORE-START =====
// Behavioural model of the S-DSM link (baseline) and the SRAM-PUF + NLFSR proposal.
// Same model as the Python version, ported so every node can be probed in the browser.

const FS = 10e6, OSR = 50, FS_OUT = FS / OSR, VDD = 1.2, VCM = 0.6;
const N_FFT = 2048, N_OUT = N_FFT + 100, N_DSM = N_OUT * OSR;
const PUF_BITS = 600, ID_BITS = 16;
const PREAMBLE = Uint8Array.from({ length: 32 }, (_, i) => (i % 2 ? 0 : 1));
const SYNC = Uint8Array.from((0xB5E3).toString(2).padStart(16, "0"), c => +c);

// ---------- random numbers (seeded, so every run is repeatable)
function makeRng(seed) {
  let a = seed >>> 0, spare = null;
  const u = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    u,
    int: n => Math.floor(u() * n),
    n() {
      if (spare !== null) { const s = spare; spare = null; return s; }
      let x, y, s;
      do { x = u() * 2 - 1; y = u() * 2 - 1; s = x * x + y * y; } while (s >= 1 || s === 0);
      const m = Math.sqrt(-2 * Math.log(s) / s);
      spare = y * m; return x * m;
    },
  };
}

// ---------- keystream generators
class LFSR16 {                       // x^16 + x^14 + x^13 + x^11 + 1 (stand-in polynomial)
  constructor(seed) { this.s = (seed & 0xFFFF) || 1; }
  bit() {
    const s = this.s, fb = (s ^ (s >> 2) ^ (s >> 3) ^ (s >> 5)) & 1;
    this.s = (s >> 1) | (fb << 15); return s & 1;
  }
  bits(n) { const o = new Uint8Array(n); for (let i = 0; i < n; i++) o[i] = this.bit(); return o; }
}

class NLFSR128 {                     // feedback taps borrowed from Grain-128's NFSR (illustrative)
  constructor(keyBits) {
    this.s = Uint8Array.from(keyBits.slice(0, 128));
    if (!this.s.some(x => x)) this.s[0] = 1;
    this.p = 0;
    for (let i = 0; i < 256; i++) this.bit();       // warm-up mixes the key
  }
  bit() {
    const s = this.s, p = this.p, b = i => s[(p + i) & 127];
    const out = s[p];
    const fb = b(0) ^ b(26) ^ b(56) ^ b(91) ^ b(96)
      ^ (b(3) & b(67)) ^ (b(11) & b(13)) ^ (b(17) & b(18))
      ^ (b(27) & b(59)) ^ (b(40) & b(48)) ^ (b(61) & b(65)) ^ (b(68) & b(84));
    s[p] = fb; this.p = (p + 1) & 127; return out;
  }
  bits(n) { const o = new Uint8Array(n); for (let i = 0; i < n; i++) o[i] = this.bit(); return o; }
}

// ---------- analog front end
const tia = (i, r) => Math.min(VDD, Math.max(0, VCM + i * r));
const s2d = (v, g) => g * (v - VCM) / (VDD / 2);

// ---------- 2nd-order 1-bit DSM (Boser-Wooley), dither at the comparator decision
function dsm2(u, o, rng) {
  const n = u.length, D = new Uint8Array(n), X1 = new Float32Array(n), X2 = new Float32Array(n), DI = new Float32Array(n);
  const l1 = new LFSR16(o.seeds[0]), l2 = new LFSR16(o.seeds[1]);
  let x1 = 0, x2 = 0, y = 1, clip = 0;
  for (let k = 0; k < n; k++) {
    const v = y ? 1 : -1;
    x1 += 0.5 * (u[k] - v);
    x2 += 0.5 * (x1 - v);
    if (Math.abs(x1) > o.xlim || Math.abs(x2) > o.xlim) {
      clip++;
      x1 = Math.max(-o.xlim, Math.min(o.xlim, x1));
      x2 = Math.max(-o.xlim, Math.min(o.xlim, x2));
    }
    const d = o.dither ? o.amp * (l1.bit() - l2.bit()) : 0;
    y = x2 * (1 + d) + d + o.noise * rng.n() >= 0 ? 1 : 0;
    D[k] = y; X1[k] = x1; X2[k] = x2; DI[k] = d;
  }
  return { D, X1, X2, DI, clip: clip / n };
}

// ---------- Rx decimation
function cic(D, R = OSR, order = 3) {
  let x = Float64Array.from(D, b => 2 * b - 1);
  for (let o = 0; o < order; o++) for (let i = 1; i < x.length; i++) x[i] += x[i - 1];
  let y = new Float64Array(Math.floor(x.length / R));
  for (let j = 0; j < y.length; j++) y[j] = x[j * R + R - 1];
  for (let o = 0; o < order; o++) for (let j = y.length - 1; j > 0; j--) y[j] -= y[j - 1];
  const g = R ** order;
  for (let j = 0; j < y.length; j++) y[j] /= g;
  return y;
}

const COMP_TAPS = (() => {           // flattens CIC droop up to 0.4 x fs_out (80 kHz)
  const R = OSR, N = 31, M = 15, h = new Float64Array(N), K = 512;
  const G = f => {
    if (f > 0.4) return 0;
    if (f === 0) return 1;
    return 1 / Math.abs(Math.sin(Math.PI * f) / (R * Math.sin(Math.PI * f / R))) ** 3;
  };
  for (let n = 0; n < N; n++) {
    let s = 0;
    for (let k = 0; k <= K; k++) {
      const f = 0.5 * k / K, w = k === 0 || k === K ? 0.5 : 1;
      s += w * G(f) * Math.cos(2 * Math.PI * f * (n - M));
    }
    h[n] = 2 * s * (0.5 / K) * (0.54 - 0.46 * Math.cos(2 * Math.PI * n / (N - 1)));
  }
  const dc = h.reduce((a, b) => a + b, 0);
  return h.map(v => v / dc);
})();

function fir(x, h) {
  const y = new Float64Array(x.length);
  for (let n = 0; n < x.length; n++) {
    let s = 0;
    for (let k = 0; k < h.length && k <= n; k++) s += h[k] * x[n - k];
    y[n] = s;
  }
  return y;
}

// ---------- FFT / spectra
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}

function bhWindow(n) {
  return Float64Array.from({ length: n }, (_, i) => {
    const x = 2 * Math.PI * i / (n - 1);
    return 0.35875 - 0.48829 * Math.cos(x) + 0.14128 * Math.cos(2 * x) - 0.01168 * Math.cos(3 * x);
  });
}

function sndr(y, bin) {
  const n = N_FFT, seg = y.slice(y.length - n), w = bhWindow(n);
  const mean = seg.reduce((a, b) => a + b, 0) / n;
  const re = Float64Array.from(seg, (v, i) => (v - mean) * w[i]), im = new Float64Array(n);
  fft(re, im);
  let sig = 0, tot = 0;
  for (let k = 4; k < n / 2; k++) {
    const p = re[k] ** 2 + im[k] ** 2;
    tot += p;
    if (Math.abs(k - bin) <= 4) sig += p;
  }
  return 10 * Math.log10(sig / Math.max(tot - sig, 1e-30));
}

function psd(x, fs, seg = 8192) {   // averaged, Hann-windowed periodogram
  seg = Math.min(seg, 1 << Math.floor(Math.log2(x.length)));
  const w = Float64Array.from({ length: seg }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (seg - 1)));
  const wp = w.reduce((a, b) => a + b * b, 0);
  const P = new Float64Array(seg / 2);
  let cnt = 0;
  for (let s = 0; s + seg <= x.length; s += seg / 2) {
    let mean = 0;
    for (let i = 0; i < seg; i++) mean += x[s + i];
    mean /= seg;
    const re = Float64Array.from({ length: seg }, (_, i) => (x[s + i] - mean) * w[i]), im = new Float64Array(seg);
    fft(re, im);
    for (let k = 0; k < seg / 2; k++) P[k] += (re[k] ** 2 + im[k] ** 2) / (fs * wp);
    cnt++;
  }
  return { f: Float64Array.from({ length: seg / 2 }, (_, k) => k * fs / seg), p: P.map(v => 10 * Math.log10(v / cnt + 1e-30)) };
}

// ---------- SHA-256 (stand-in for the on-chip hash)
function sha256(bytes) {
  const K = new Uint32Array([0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  const l = bytes.length, padLen = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(padLen);
  m.set(bytes); m[l] = 0x80;
  const bits = l * 8;
  m[padLen - 4] = (bits >>> 24) & 255; m[padLen - 3] = (bits >>> 16) & 255; m[padLen - 2] = (bits >>> 8) & 255; m[padLen - 1] = bits & 255;
  const W = new Uint32Array(64), rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < padLen; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = (m[o + 4 * i] << 24) | (m[o + 4 * i + 1] << 16) | (m[o + 4 * i + 2] << 8) | m[o + 4 * i + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(W[i - 15], 7) ^ rotr(W[i - 15], 18) ^ (W[i - 15] >>> 3);
      const s1 = rotr(W[i - 2], 17) ^ rotr(W[i - 2], 19) ^ (W[i - 2] >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25), ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
  }
  const out = new Uint8Array(32);
  for (let i = 0; i < 8; i++) { out[4 * i] = H[i] >>> 24; out[4 * i + 1] = (H[i] >>> 16) & 255; out[4 * i + 2] = (H[i] >>> 8) & 255; out[4 * i + 3] = H[i] & 255; }
  return out;
}

const packBits = bits => {
  const out = new Uint8Array(Math.ceil(bits.length / 8));
  for (let i = 0; i < bits.length; i++) if (bits[i]) out[i >> 3] |= 128 >> (i & 7);
  return out;
};
const unpackBits = (bytes, n) => Uint8Array.from({ length: n }, (_, i) => (bytes[i >> 3] >> (7 - (i & 7))) & 1);
const hashKey = w => unpackBits(sha256(packBits(w)).slice(0, 16), 128);   // 128-bit key

// ---------- binary BCH over GF(2^10), syndrome construction
const GF_N = 1023, EXP = new Int32Array(2 * GF_N), LOG = new Int32Array(GF_N + 1);
(() => { let x = 1; for (let i = 0; i < GF_N; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 1024) x ^= 0x409; } for (let i = GF_N; i < 2 * GF_N; i++) EXP[i] = EXP[i - GF_N]; })();
const gmul = (a, b) => (a && b ? EXP[LOG[a] + LOG[b]] : 0);
const gdiv = (a, b) => (a ? EXP[(LOG[a] - LOG[b] + GF_N) % GF_N] : 0);

function bchSyndrome(bits, t) {      // odd syndromes S1, S3, ... S(2t-1); this is the helper data
  const S = new Int32Array(t);
  for (let i = 0; i < bits.length; i++) if (bits[i]) for (let j = 0; j < t; j++) S[j] ^= EXP[(i * (2 * j + 1)) % GF_N];
  return S;
}
const synToBits = S => { const o = new Uint8Array(S.length * 10); S.forEach((v, j) => { for (let b = 0; b < 10; b++) o[j * 10 + b] = (v >> (9 - b)) & 1; }); return o; };
const bitsToSyn = (bits, t) => Int32Array.from({ length: t }, (_, j) => { let v = 0; for (let b = 0; b < 10; b++) v = (v << 1) | bits[j * 10 + b]; return v; });

function bchDecode(synDiff, t, n) {  // synDiff = syndrome(w_noisy) xor h  ->  error pattern e
  const S = new Int32Array(2 * t + 1);
  for (let i = 1; i <= 2 * t; i++) S[i] = i % 2 ? synDiff[(i - 1) / 2] : gmul(S[i / 2], S[i / 2]);
  const e = new Uint8Array(n);
  if (!S.some(v => v)) return { ok: true, e, L: 0 };
  let C = [1], B = [1], L = 0, m = 1, b = 1;
  for (let k = 0; k < 2 * t; k++) {
    let d = S[k + 1];
    for (let i = 1; i <= L; i++) d ^= gmul(C[i] || 0, S[k + 1 - i]);
    if (!d) { m++; continue; }
    const coef = gdiv(d, b), T = C.slice();
    while (C.length < B.length + m) C.push(0);
    for (let i = 0; i < B.length; i++) C[i + m] ^= gmul(coef, B[i]);
    if (2 * L <= k) { L = k + 1 - L; B = T; b = d; m = 1; } else m++;
  }
  if (L > t) return { ok: false, e, L };
  let roots = 0;
  for (let pos = 0; pos < n; pos++) {
    let v = 0;
    for (let k = 0; k <= L; k++) if (C[k]) v ^= gmul(C[k], EXP[(GF_N - (pos * k) % GF_N) % GF_N]);
    if (!v) { e[pos] = 1; roots++; }
  }
  return roots === L ? { ok: true, e, L } : { ok: false, e: new Uint8Array(n), L };
}

// ---------- SRAM PUF
class SRAMPUF {
  constructor(seed, n = PUF_BITS, sigma25 = 0.06) {
    const r = makeRng(seed);
    this.mismatch = Float64Array.from({ length: n }, () => r.n());   // fixed at fabrication
    this.sigma25 = sigma25;
  }
  sigma(T) { return this.sigma25 * (1 + 0.008 * Math.abs(T - 25)); }
  read(T, rng) {
    const s = this.sigma(T);
    return Uint8Array.from(this.mismatch, m => (m + s * rng.n() > 0 ? 1 : 0));
  }
}

function enroll(puf, t, rng) {
  const w = puf.read(25, rng);
  return { w, h: bchSyndrome(w, t), key: hashKey(w) };
}

function reconstruct(wNoisy, h, t) {
  const sn = bchSyndrome(wNoisy, t);
  const diff = sn.map((v, j) => v ^ h[j]);
  const dec = bchDecode(diff, t, wNoisy.length);
  const w = wNoisy.map((b, i) => b ^ dec.e[i]);
  return { ok: dec.ok, e: dec.e, w, key: hashKey(w), synNoisy: sn };
}

// ---------- attacks
function bm2(s) {                    // Berlekamp-Massey over GF(2)
  const n = s.length, c = new Uint8Array(n + 1);
  let b = new Uint8Array(n + 1), cc = c;
  cc[0] = b[0] = 1;
  let L = 0, m = -1;
  for (let i = 0; i < n; i++) {
    let d = s[i];
    for (let j = 1; j <= L; j++) d ^= cc[j] & s[i - j];
    if (d) {
      const t = cc.slice(), sh = i - m;
      for (let j = 0; j + sh <= n; j++) cc[j + sh] ^= b[j];
      if (2 * L <= i) { L = i + 1 - L; m = i; b = t; }
    }
  }
  return { L, c: cc.slice(0, L + 1) };
}

function lfsrPredict(c, L, known, nOut) {
  const buf = Array.from(known.slice(Math.max(0, known.length - L))), out = new Uint8Array(nOut);
  for (let k = 0; k < nOut; k++) {
    let nb = 0;
    for (let j = 1; j <= L; j++) nb ^= c[j] & buf[buf.length - j];
    buf.push(nb); out[k] = nb;
  }
  return out;
}

function bmAttack(known, future) {
  const { L, c } = bm2(known), g = lfsrPredict(c, L, known, future.length);
  let ok = 0;
  for (let i = 0; i < g.length; i++) ok += g[i] === future[i];
  return { acc: ok / future.length, L, guess: g };
}

function longestRun(D) {
  let best = 0, run = 0, prev = -1;
  for (let i = 0; i < D.length; i++) { run = D[i] === prev ? run + 1 : 1; prev = D[i]; if (run > best) best = run; }
  return best;
}

// ---------- full link
const DEFAULTS = {
  scheme: "proposed", sig: "sine", amp_uA: 0.93, bin: 205, dc_uA: 0.5, force_uA: 10,
  rtia: 321.88e3, buffer: 0.5, dither: true, dither_amp: 0.022, comp_noise: 1e-3, xlim: 2.5,
  dither_seeds: [0x1D2B, 0x7A31], key16: 0xC3A5, chip_id: 0x0B77,
  chip_seed: 7, temp: 37, puf_sigma: 0.06, bch_t: 40, h_tamper: 0,
  ber: 0, lead: 200, rx_wrong_key: false, seed: 2026,
};

function sensorCurrent(P, n) {
  const i = new Float64Array(n), f = P.bin * FS_OUT / N_FFT;
  for (let k = 0; k < n; k++) {
    const t = k / FS;
    if (P.sig === "sine") i[k] = P.amp_uA * 1e-6 * Math.sin(2 * Math.PI * f * t);
    else if (P.sig === "dc") i[k] = P.dc_uA * 1e-6;
    else if (P.sig === "forced") i[k] = P.force_uA * 1e-6;
    else if (P.sig === "zero") i[k] = 0;
  }
  return i;
}

function simulate(P0) {
  const P = { ...DEFAULTS, ...P0 };
  const rng = makeRng(P.seed), n = N_DSM, t = P.bch_t;
  const S = { P, n };

  // Tx analog chain
  S.i_sense = sensorCurrent(P, n);
  S.v_tia = S.i_sense.map(i => tia(i, P.rtia));
  S.u = S.v_tia.map(v => s2d(v, P.buffer));
  const dsm = dsm2(S.u, { dither: P.dither, amp: P.dither_amp, seeds: P.dither_seeds, xlim: P.xlim, noise: P.comp_noise }, rng);
  Object.assign(S, { D: dsm.D, x1: dsm.X1, x2: dsm.X2, dith: dsm.DI, clip: dsm.clip });

    S.e_hat = rc.e; S.w_fixed = rc.w; S.key_tx = rc.key; S.fe_ok = rc.ok;
    S.syn_noisy_bits = synToBits(rc.synNoisy);
    S.n_err_true = S.e_true.reduce((a, b) => a + b, 0);
    S.n_err_fixed = rc.e.reduce((a, b) => a + b, 0);
    S.key_match = S.key_tx.every((b, i) => b === S.key_enroll[i]);
    S.ber_puf = S.n_err_true / PUF_BITS;
    S.ks_all = new NLFSR128(S.key_tx).bits(ID_BITS + n);
  }

  S.enc_id = idBits.map((b, i) => b ^ S.ks_all[i]);
  S.frame = new Uint8Array(PREAMBLE.length + SYNC.length + ID_BITS + n);
  S.frame.set(PREAMBLE, 0); S.frame.set(SYNC, 32); S.frame.set(S.enc_id, 48); S.frame.set(S.C, 64);

  // channel
  const rc = makeRng(P.seed + 5);
  S.rx_bits = new Uint8Array(P.lead + S.frame.length);
  for (let i = 0; i < P.lead; i++) S.rx_bits[i] = rc.int(2);
  S.rx_bits.set(S.frame, P.lead);
  let flips = 0;
  if (P.ber > 0) for (let i = 0; i < S.rx_bits.length; i++) if (rc.u() < P.ber) { S.rx_bits[i] ^= 1; flips++; }

  const hdr = new Uint8Array(48); hdr.set(PREAMBLE); hdr.set(SYNC, 32);

  } else {
    S.key_rx = P.rx_wrong_key ? Uint8Array.from({ length: 128 }, () => rng.int(2)) : rxdb.key;

  }
  S.K_rx = S.ks_rx_all.subarray(ID_BITS);
  if (pos >= 0) {
    S.enc_id_rx = S.rx_bits.slice(pos, pos + ID_BITS);
    S.id_rx = S.enc_id_rx.map((b, i) => b ^ S.ks_rx_all[i]);
    S.id_ok = S.id_rx.every((b, i) => b === idBits[i]);
    S.C_rx = S.rx_bits.slice(pos + ID_BITS, pos + ID_BITS + n);
  } else {
    S.id_ok = false; S.C_rx = new Uint8Array(n); S.id_rx = new Uint8Array(ID_BITS);
  }
  S.D_rx = S.C_rx.map((c, i) => c ^ S.K_rx[i]);
  S.y_cic = cic(S.D_rx);
  S.y = fir(S.y_cic, COMP_TAPS);
  S.u_ref = Float64Array.from({ length: S.y.length }, (_, j) => S.u[j * OSR]);
  S.sndr = P.sig === "sine" ? sndr(S.y, P.bin) : null;
  let bitErr = 0;
  for (let i = 0; i < n; i++) bitErr += S.D_rx[i] !== S.D[i];
  S.rx_bit_err = bitErr / n;

  // Eve: sees the channel, knows the frame format and the whole design, not the key
  S.C_eve = S.C_rx;
  S.K_eve_guess = S.C_eve.map(c => c ^ 1);            // saturation hypothesis: D = all 1s
  const er = makeRng(P.seed + 31), win = 64, fut = 512;
  let best = { acc: 0, start: 0, res: null }, broken = 0, tries = 120;
  for (let k = 0; k < tries; k++) {
    const s = 200 + er.int(n - win - fut - 400);
    const r = bmAttack(S.K_eve_guess.subarray(s, s + win), S.K.subarray(s + win, s + win + fut));
    if (r.acc > 0.99) broken++;
    if (r.acc > best.acc) best = { acc: r.acc, start: s, res: r };

  S.eve_forced_best = best.acc; S.eve_forced_broken = broken / tries;
  S.eve_pred = new Uint8Array(n); S.eve_match = new Uint8Array(n);
  {
    const s = best.start, known = S.K_eve_guess.subarray(s, s + win), { L, c } = bm2(known);
    const g = lfsrPredict(c, L, known, n - s - win);
    S.eve_pred.set(g, s + win);
    for (let i = s + win; i < n; i++) S.eve_match[i] = S.eve_pred[i] === S.K[i] ? 1 : 0;
    S.eve_window = [s, s + win];
    S.eve_L = L;
  }

  S.eve_id = bmAttack(S.ks_all.subarray(0, 16), S.ks_all.subarray(16, 1016));

const GLOSS = [
  ["TIA", "Transimpedance amplifier. Turns the sensor's tiny current into a voltage."],
  ["VCM", "Common-mode voltage. The resting middle level of the signal, here 0.6 V."],
  ["DSM", "Delta-sigma modulator. An analog-to-digital converter that outputs a fast stream of single bits."],
  ["Quantization noise", "The small error made every time the modulator rounds its answer to 1 or 0. It makes the bit pattern hard to predict."],
  ["Dither", "A deliberate small random nudge added inside the modulator to break up repeating patterns."],
  ["XOR", "A bit rule: output 1 if the two input bits differ, 0 if they are the same. Doing it twice with the same key undoes it."],
  ["Keystream", "A long sequence of key bits, one per data bit, used to scramble the data."],
  ["LFSR", "Linear feedback shift register. A cheap keystream generator whose rule is linear, so it can be reverse-engineered from a short piece of output."],
  ["NLFSR", "Non-linear feedback shift register. Like an LFSR but with AND terms, which makes reverse-engineering far harder."],
  ["Berlekamp-Massey", "An algorithm that finds the simplest linear rule producing a bit sequence. It breaks any LFSR after seeing twice its length in clean bits."],
  ["PUF", "Physically unclonable function. A chip-unique fingerprint created by random manufacturing differences."],
  ["BCH code", "An error-correcting code. It lets you repair a limited number of flipped bits, up to t."],
  ["Syndrome / helper data", "A short checksum of the fingerprint. It lets the decoder find which bits flipped without revealing the bits themselves."],
  ["Hash", "A one-way scrambler. Same input gives the same output; you cannot work backwards."],
  ["CIC filter", "A cheap averaging filter that turns the fast bitstream into a slower, multi-bit signal."],
  ["SNDR", "Signal-to-noise-and-distortion ratio, in dB. About 60 dB is clean; near 0 dB means the signal is gone."],
  ["Rx / Tx", "Receiver and transmitter."],
];

  },

  // ---------------------------------------------------------------- S2D

        <tr><td>TIA swing (this input)</td><td class="n">±${(Math.max(...Array.from({ length: 2000 }, (_, i) => Math.abs(S.v_tia[i] - VCM)))).toFixed(3)} V</td></tr>

        <tr><td>DSM stable range</td><td class="n">±1.0 (= ref)</td></tr>
        <tr><td>Integrators clipped</td><td class="n">${(S.clip * 100).toFixed(1)}%</td></tr></table>`)
      + explain(`<b>The buffer is the saturation guard.</b> The DSM feedback can only balance an input up to about ±1 (its reference). The buffer halves the already-rail-limited TIA swing, so <code>|u|</code> stays inside that range and the loop never overloads.
        ${clipping ? (state.buffer < 1 ? `<br><br>Right now you're forcing a huge input, but with the buffer ON the DSM input is still only <b>${(Math.max(...Array.from({ length: 4000 }, (_, i) => Math.abs(S.u[i])))).toFixed(2)}</b> — safe.` : `<br><br><span style="color:var(--warn)"><b>Buffer is OFF.</b></span> The forced input pushes <code>|u|</code> past ±1, the DSM saturates, and its output gets stuck — jump to the DSM block to see it.`) : ""}`);
    const c = document.querySelector("#panels canvas"); const g = dpiCanvas(c, 220);

    g.ctx.setLineDash([]);
    line(g.ctx, null, Array.from({ length: WN }, (_, i) => (S.v_tia[WOFF + i] - VCM) / (VDD / 2)), a.X, a.Y, COL.sigd(), 1.4);
    line(g.ctx, null, Array.from({ length: WN }, (_, i) => S.u[WOFF + i]), a.X, a.Y, COL.sig(), 2);
    c.parentElement.querySelector(".legend").innerHTML = legend([["TIA (normalised)", COL.sigd()], ["DSM input u (after buffer)", COL.sig()], ["±ref (stable range)", COL.warn()]]);
  },

  // ---------------------------------------------------------------- DSM
  dsm_out() {
    document.getElementById("panels").innerHTML =
      panelCanvas("Integrator states + comparator output", "The 1-bit output D toggles as the loop chases the input. Watch the integrators stay inside their rails — or not.", 240)
      + panelCanvas("Output bitstream D", "Raw modulator bits. Density of 1s encodes the input; the toggling carries the quantization noise that hides the key.", 150)
      + panelWide("Bit statistics", `<table class="mini"><tr><th>Metric</th><th>Value</th><th></th></tr>
        <tr><td>Fraction of 1s</td><td class="n">${(S.ones * 100).toFixed(1)}%</td><td>${S.sig === "dc" || S.sig === "forced" ? "encodes the DC level" : "≈50% for a centred sine"}</td></tr>
        <tr><td>Longest identical run</td><td class="n">${S.run}</td><td>${pill(S.run < 32, "< 32: BM-safe", "≥ 32: exposes keystream")}</td></tr>
        <tr><td>Integrators clipped</td><td class="n">${(S.clip * 100).toFixed(1)}%</td><td>${pill(S.clip < 0.01, "loop in control", "SATURATED")}</td></tr></table>`)
      + explain(`<b>The DSM is where security lives.</b> A 2nd-order 1-bit modulator turns <code>u</code> into a fast bitstream. Even a constant input gives a busy, hard-to-predict pattern thanks to quantization noise and dither. The XOR then hides the keystream underneath that unpredictability.
        <br><br>If an attacker can force the loop to <b>saturate</b>, D freezes at all-1s (or all-0s). Then the encrypted output is just the keystream flipped — the run length shoots past 32 and Berlekamp-Massey can recover the LFSR. ${S.run >= 32 ? `<span style="color:var(--warn)"><b> That's happening now.</b></span>` : `Right now the longest run is only <b>${S.run}</b>, so the keystream stays hidden.`}`);
    const [c1, c2] = document.querySelectorAll("#panels canvas");

    g.ctx.setLineDash([]);

    c1.parentElement.querySelector(".legend").innerHTML = legend([["integrator 1", COL.sigd()], ["integrator 2", COL.sig()], ["±rail", COL.warn()], ["D = 1", COL.key()]]);
    g = dpiCanvas(c2, 150);
    a = axes(g.ctx, g.w, g.h, { l: 46, r: 12, t: 8, b: 28 }, [0, 96], [-0.15, 1.15], { ny: 1, yfmt: v => v < 0.5 ? "0" : "1", xlabel: "DSM clocks" });
    stepDigital(g.ctx, S.D, WOFF, 96, a.X, a.Y, COL.sig());
    c2.parentElement.querySelector(".legend").innerHTML = legend([["modulator output D", COL.sig()]]);
  },

  // ---------------------------------------------------------------- XOR
  xor_out() {
    const off = WOFF, n = 40;
    document.getElementById("panels").innerHTML =
      panelWide("Encryption, bit by bit", `<div class="bitrow"><span class="tag data">D&nbsp;</span> ${colorBits(S.D, off, n, null)}</div>
        <div class="bitrow"><span class="tag key">K&nbsp;</span> ${colorBits(S.K, off, n, null, true)}</div>
        <div class="bitrow"><span class="tag data">C&nbsp;</span> ${colorBits(S.C, off, n, null)}</div>
        <p class="cap" style="margin-top:10px">C = D ⊕ K. Because K looks random and D keeps toggling, C reveals nothing on its own.</p>`)
      + panelCanvas("Spectrum: encrypted vs original", "The XOR spreads the noise-shaped signal into a flat, noise-like spectrum on the wire.", 230)
      + explain(`<b>One XOR gate is the whole cipher.</b> Each modulator bit is XORed with one keystream bit. The receiver, holding the same key, regenerates K and XORs again to undo it (<code>C ⊕ K = D</code>).
        <br><br>The attacker's basic move is <code>K = C ⊕ D</code>: if they ever learn D (e.g. by saturating the DSM), they get K. Everything upstream — the buffer, the dither, the busy bitstream — exists to keep D unpredictable so this subtraction fails.`);
    const c = document.querySelector("#panels canvas"); const g = dpiCanvas(c, 230);
    const specC = psd(Float64Array.from(S.C, b => 2 * b - 1), FS, 4096);
    const specD = psd(Float64Array.from(S.D, b => 2 * b - 1), FS, 4096);
    const xr = [Math.log10(2e3), Math.log10(FS / 2)];
    const a = axes(g.ctx, g.w, g.h, { l: 46, r: 12, t: 12, b: 34 }, xr, [-120, -40],
      { yfmt: v => v.toFixed(0), xlabel: "frequency (Hz, log)", xticks: [[4, "10k"], [5, "100k"], [6, "1M"]].map(([e, l]) => [e, l]) });
    const plotSpec = (sp, col, wd) => { const xs = [], ys = []; for (let k = 1; k < sp.f.length; k++) { xs.push(Math.log10(sp.f[k])); ys.push(sp.p[k]); } line(g.ctx, xs, ys, a.X, a.Y, col, wd); };
    plotSpec(specC, COL.key(), 1.2); plotSpec(specD, COL.sig(), 1.6);
    g.ctx.strokeStyle = COL.faint(); g.ctx.setLineDash([4, 4]);
    g.ctx.beginPath(); g.ctx.moveTo(a.X(Math.log10(1e5)), 12); g.ctx.lineTo(a.X(Math.log10(1e5)), g.h - 34); g.ctx.stroke(); g.ctx.setLineDash([]);
    c.parentElement.querySelector(".legend").innerHTML = legend([["encrypted C (on the wire)", COL.key()], ["decrypted D (at Rx)", COL.sig()], ["100 kHz band", COL.faint()]]);
  },

  // ---------------------------------------------------------------- frame
  frame() {
    const idBits = Uint8Array.from(state.chip_id.toString(2).padStart(16, "0"), c => +c);
    document.getElementById("panels").innerHTML =
      panelWide("Transmitted frame", `<div class="bitrow">
        <span class="tag data">preamble</span> ${fmtBits(PREAMBLE, 0, 32)}<br>
        <span class="tag data">sync</span> ${fmtBits(SYNC, 0, 16)}<br>
        <span class="tag key">enc ID</span> ${fmtBits(S.enc_id, 0, 16)} <span style="color:var(--ink-faint)">(ID ${"0x" + state.chip_id.toString(16)} XOR first 16 key bits)</span><br>
        <span class="tag data">enc data…</span> ${fmtBits(S.C, 0, 48)}…</div>
        <p class="cap" style="margin-top:10px">This is Alperen's real protocol: preamble + sync align the receiver, and the encrypted ID lets the Rx confirm it has the right key.</p>`)
      + explain(`<b>The frame doubles as an alignment and key check.</b> The receiver finds the preamble/sync, then decrypts the ID. If the decrypted ID matches the expected one, the keys are aligned and correct. ${state.scheme === "proposed" ? `In the proposed design this same check catches a failed PUF reconstruction or tampered helper data — a wrong key gives a garbled ID.` : `With a static key this is only an alignment/debug aid, not true authentication.`}
        <br><br>As Alperen noted, the known ID leaks the first 16 keystream bits — but 16 < 2×16, so it's not enough for Berlekamp-Massey (see the keystream block).`);
  },

  // ---------------------------------------------------------------- channel
  channel() {
    document.getElementById("panels").innerHTML =
      panelWide("On the wire — what an eavesdropper sees", `<div class="bitrow">${colorBits(S.rx_bits, Math.max(0, S.sync_pos - 20), 80, S.sync_pos)}</div>
        <p class="cap" style="margin-top:8px">Random idle bits, then the frame. Sync found at position <b>${S.sync_pos}</b>. Channel flipped <b>${S.channel_flips}</b> bits (BER ${(state.ber * 100).toFixed(2)}%).</p>`)
      + explain(`<b>Eve's vantage point.</b> The attacker sees exactly this bitstream and knows the full design — everything except the key. The encrypted payload looks like noise. Channel bit errors (raise the BER slider) also land here; the CIC filter at the Rx averages most of them out, but a wrong key or lost sync does not survive.`);
  },

  // ---------------------------------------------------------------- rx decrypt
  rx_dec() {
    const off = WOFF, n = 40;
    document.getElementById("panels").innerHTML =
      panelWide("Decryption at the receiver", `<div class="bitrow"><span class="tag data">C&nbsp;&nbsp;</span> ${fmtBits(S.C_rx, off, n)}</div>
        <div class="bitrow"><span class="tag key">K_rx</span> ${colorBits(S.K_rx, off, n, null, true)}</div>
        <div class="bitrow"><span class="tag data">D_rx</span> ${colorBits2(S.D_rx, S.D, off, n)}</div>
        <p class="cap" style="margin-top:10px">${state.rx_wrong_key ? `<span style="color:var(--warn)"><b>Wrong key:</b></span> D_rx (red where it differs from the true D) is essentially random — the signal is lost.` : `Correct key: D_rx matches the transmitted D exactly.`} Bit error vs Tx: <b>${(S.rx_bit_err * 100).toFixed(1)}%</b>.</p>`)
      + explain(`<b>Same key, reversed.</b> The Rx generates the identical keystream and XORs it back: <code>D = C ⊕ K</code>. ${state.scheme === "proposed" ? `The Rx's key came from the PUF enrollment stored in its database; the Tx's key was just regenerated from the live PUF. They match only if reconstruction succeeded.` : `Both sides share the static pre-shared key.`}
        <br><br>This is why a one-bit key error is catastrophic, not gradual: XOR with the wrong keystream scrambles every bit, so the ID check fails immediately and the recovered waveform is noise.`);
  },

  // ---------------------------------------------------------------- rx out
  rx_out() {
    document.getElementById("panels").innerHTML =
      panelCanvas("Recovered output (CIC + compensation)", state.rx_wrong_key ? "With the wrong key the decimated output is noise." : "The decimator averages the corrected bitstream back into the analog waveform.", 230)
      + panelCanvas("Spectrum of the recovered signal", "Signal tone (if any) stands above the noise floor when the key is right.", 230)
      + panelWide("Link quality", `<table class="mini"><tr><th>Metric</th><th>Value</th></tr>
        <tr><td>Rx ID check</td><td>${pill(S.id_ok, "PASS", "FAIL")}</td></tr>
        <tr><td>SNDR</td><td class="n">${S.sndr != null ? S.sndr.toFixed(1) + " dB" : "—"}</td></tr>
        <tr><td>Bit errors vs Tx</td><td class="n">${(S.rx_bit_err * 100).toFixed(2)}%</td></tr></table>`)
      + explain(`<b>The end of the chain.</b> A 3rd-order CIC filter decimates the 10 MHz bitstream by ${OSR}× down to ${(FS_OUT / 1e3).toFixed(0)} kS/s, and a compensation FIR flattens the CIC droop. With the correct key you get the original sensor signal back at ~${S.sndr != null && S.sndr > 0 ? S.sndr.toFixed(0) : "—"} dB SNDR; with a wrong key, only noise.`);
    const [c1, c2] = document.querySelectorAll("#panels canvas");
    let g = dpiCanvas(c1, 230);
    const nshow = Math.min(120, S.y.length - 5);
    const seg = Array.from({ length: nshow }, (_, i) => S.y[S.y.length - nshow + i]);
    const mx = Math.max(0.05, ...seg.map(Math.abs)) * 1.2;
    let a = axes(g.ctx, g.w, g.h, { l: 46, r: 12, t: 12, b: 30 }, [0, nshow], [-mx, mx], { xlabel: "output samples (200 kS/s)" });
    if (!state.rx_wrong_key && state.sig === "sine") { const ref = Array.from({ length: nshow }, (_, i) => S.u_ref[S.u_ref.length - nshow + i]); line(g.ctx, null, ref, a.X, a.Y, COL.sigd(), 1.2); }
    line(g.ctx, null, seg, a.X, a.Y, state.rx_wrong_key ? COL.warn() : COL.sig(), 1.8);
    c1.parentElement.querySelector(".legend").innerHTML = legend(state.rx_wrong_key ? [["recovered (noise)", COL.warn()]] : [["DSM input u (ref)", COL.sigd()], ["recovered output", COL.sig()]]);
    g = dpiCanvas(c2, 230);
    const sp = psd(Float64Array.from(S.y.slice(-2048)), FS_OUT, 1024);
    a = axes(g.ctx, g.w, g.h, { l: 46, r: 12, t: 12, b: 34 }, [0, 100], [-120, 0], { yfmt: v => v.toFixed(0), xlabel: "frequency (kHz)" });
    const xs = [], ys = []; for (let k = 1; k < sp.f.length; k++) { xs.push(sp.f[k] / 1e3); ys.push(sp.p[k]); }
    line(g.ctx, xs, ys, a.X, a.Y, state.rx_wrong_key ? COL.warn() : COL.sig(), 1.4);
    c2.parentElement.querySelector(".legend").innerHTML = legend([["recovered spectrum", state.rx_wrong_key ? COL.warn() : COL.sig()]]);
  },

  // ---------------------------------------------------------------- key: LFSR / PSK
  psk() { keystreamPanel("The static pre-shared key seeds the LFSR. Same key, same stream, every session."); },
  lfsr() { keystreamPanel("A 16-bit LFSR turns the key into the keystream. Linear feedback — which is exactly what Berlekamp-Massey exploits."); },
  nlfsr() { keystreamPanel("A 128-bit NLFSR turns the PUF key into the keystream. Nonlinear feedback defeats Berlekamp-Massey."); },

  // ---------------------------------------------------------------- PUF
  puf() {
    if (state.scheme !== "proposed") return;
    document.getElementById("panels").innerHTML =
      panelCanvas("SRAM power-up fingerprint", "Each cell's mismatch decides 0/1. A handful of near-balanced cells flip between power-ups — that's the noise the fuzzy extractor removes.", 200)
      + panelWide("This power-up vs enrollment", `<table class="mini"><tr><th>Metric</th><th>Value</th><th></th></tr>
        <tr><td>PUF bits</td><td class="n">${PUF_BITS}</td><td></td></tr>
        <tr><td>Flipped since enrollment</td><td class="n">${S.n_err_true}</td><td>${(S.ber_puf * 100).toFixed(1)}% BER at ${state.temp}°C</td></tr>
        <tr><td>Inter-chip difference</td><td class="n">≈50%</td><td>different chip = different key</td></tr></table>`)
      + explain(`<b>The chip's fingerprint.</b> At power-up each SRAM cell settles to 0 or 1 based on fabrication mismatch — a pattern <code>w</code> unique to this chip and impossible to clone. Raise the temperature or PUF σ and more cells flip (the red marks), which is why error correction is needed before the bits can become a stable key.`);
    const c = document.querySelector("#panels canvas"); const g = dpiCanvas(c, 200);
    const show = 120; const a = axes(g.ctx, g.w, g.h, { l: 30, r: 12, t: 10, b: 24 }, [0, show], [-0.1, 1.1], { ny: 1, yfmt: v => v < .5 ? "0" : "1", xlabel: "PUF cell index (first 120)" });
    const cw = (a.X(1) - a.X(0));
    for (let i = 0; i < show; i++) {
      const flipped = S.e_true[i];
      g.ctx.fillStyle = flipped ? COL.warn() : COL.sig();
      g.ctx.fillRect(a.X(i) + cw * 0.15, a.Y(S.w_noisy[i]) - 2, Math.max(1.5, cw * 0.7), 4);
      g.ctx.fillRect(a.X(i) + cw * 0.15, Math.min(a.Y(S.w_noisy[i]), a.Y(0)), Math.max(1.5, cw * 0.7), Math.abs(a.Y(S.w_noisy[i]) - a.Y(0)));
    }
    c.parentElement.querySelector(".legend").innerHTML = legend([["stable bit", COL.sig()], ["flipped this power-up", COL.warn()]]);
  },

  // ---------------------------------------------------------------- fuzzy extractor
  fe() {
    if (state.scheme !== "proposed") return;
    const canFix = S.n_err_true <= state.bch_t && state.h_tamper === 0;
    document.getElementById("panels").innerHTML =
      panelCanvas("Error correction headroom", "PUF errors this power-up vs what the BCH code can fix. Stay left of the line and the key is exact.", 210)
      + panelWide("Reconstruction result", `<table class="mini"><tr><th>Step</th><th>Value</th><th></th></tr>
        <tr><td>Errors to correct</td><td class="n">${S.n_err_true}</td><td></td></tr>
        <tr><td>BCH capacity t</td><td class="n">${state.bch_t}</td><td>${pill(S.n_err_true <= state.bch_t, "within capacity", "too many errors")}</td></tr>
        <tr><td>Helper data tampered</td><td class="n">${state.h_tamper} bits</td><td>${state.h_tamper === 0 ? "clean" : pill(false, "", "corrupts target")}</td></tr>
        <tr><td>Decoder succeeded</td><td>${pill(S.fe_ok, "yes", "no")}</td><td></td></tr>
        <tr><td>Key matches enrollment</td><td>${pill(S.key_match, "MATCH", "MISMATCH")}</td><td>${S.key_match ? "link works" : "Rx ID check will fail"}</td></tr></table>`)
      + explain(`<b>Noisy fingerprint → exact key.</b> The Rx sends the public helper data <code>h</code> (the BCH syndrome of the enrolled <code>w</code>). The chip reads a noisy <code>w'</code>, computes <code>syndrome(w') ⊕ h</code>, and the BCH decoder turns that into the exact list of flipped bits, which it flips back. Then <code>key = hash(w)</code> — identical every power-up.
        <br><br>${canFix ? `Right now ${S.n_err_true} errors ≤ t=${state.bch_t}, so the key is recovered perfectly.` : S.n_err_true > state.bch_t ? `<span style="color:var(--warn)"><b>Too many errors</b></span> (${S.n_err_true} > t=${state.bch_t}): the decoder can't fix them, the key is wrong, and the Rx ID check fails. Raise t or lower the temperature.` : `<span style="color:var(--warn)"><b>Helper data was tampered.</b></span> Even one flipped bit in h shifts the decoder's target, so the key comes out wrong — and the Rx ID check flags it. That's the tamper-detection property.`}`);
    const c = document.querySelector("#panels canvas"); const g = dpiCanvas(c, 210);
    const a = axes(g.ctx, g.w, g.h, { l: 68, r: 12, t: 16, b: 30 }, [0, 70], [-0.1, 1.1], { ny: 1, yfmt: v => v < 0.5 ? "key wrong" : "key exact", xlabel: "flipped PUF bits" });
    // success curve: 1 if n<=t else 0, drawn as a step at t
    line(g.ctx, [0, state.bch_t, state.bch_t, 70], [1, 1, 0, 0], a.X, a.Y, COL.sig(), 2);
    // marker for current error count
    g.ctx.fillStyle = S.n_err_true <= state.bch_t ? COL.good() : COL.warn();
    g.ctx.beginPath(); g.ctx.arc(a.X(S.n_err_true), a.Y(S.n_err_true <= state.bch_t ? 1 : 0), 5, 0, 7); g.ctx.fill();
    g.ctx.strokeStyle = COL.faint(); g.ctx.setLineDash([4, 4]);
    g.ctx.beginPath(); g.ctx.moveTo(a.X(state.bch_t), 12); g.ctx.lineTo(a.X(state.bch_t), g.h - 30); g.ctx.stroke(); g.ctx.setLineDash([]);
    g.ctx.fillStyle = COL.faint(); g.ctx.textAlign = "center"; g.ctx.fillText("t = " + state.bch_t, a.X(state.bch_t), 8);
    c.parentElement.querySelector(".legend").innerHTML = legend([["key correct", COL.sig()], ["this power-up", S.n_err_true <= state.bch_t ? COL.good() : COL.warn()]]);
  },

  keyd() { keystreamPanel("hash(w) compresses the corrected PUF fingerprint into a uniform 128-bit key. One-way: the key never reveals w."); },
};

    `<canvas data-h="${H}"></canvas><div class="legend">${legend([["analog signal", COL.sig()], ["data bits", CSS("--ink")], ["key bits", COL.key()]])}</div>`);
  const c = document.querySelector("#panels canvas"), pk = Math.max(1e-9, peakAbs(S.i_sense)), ink = CSS("--ink");

// keystream / BM attack panel shared by key nodes
function keystreamPanel(caption) {
  const isNL = state.scheme === "proposed";
  const probe = S.eve_probe, idl = S.eve_id;
  document.getElementById("panels").innerHTML =
    panelWide("Keystream under Berlekamp-Massey", `<p class="cap">${caption}</p>
      <table class="mini"><tr><th>Attack</th><th>Bits known</th><th>Recovered LFSR length</th><th>Future bits predicted</th><th></th></tr>
      <tr><td>Known ID leak</td><td class="n">16</td><td class="n">${idl.L}</td><td class="n">${(idl.acc * 100).toFixed(0)}%</td><td>${pill(idl.acc < 0.9, "safe", "broken")}</td></tr>
      <tr><td>Probe / tamper</td><td class="n">64</td><td class="n">${probe.L}</td><td class="n">${(probe.acc * 100).toFixed(0)}%</td><td>${pill(probe.acc < 0.9, "safe", "broken")}</td></tr>
      ${S.sig === "forced" ? `<tr><td>Forced-input (saturation)</td><td class="n">64×many</td><td class="n">—</td><td class="n">${(S.eve_forced_best * 100).toFixed(0)}%</td><td>${pill(S.eve_forced_broken < 0.5, "safe", "broken")}</td></tr>` : ""}
      </table>`)
    + panelCanvas("What the attacker predicts vs the real keystream", "Green where the attacker's prediction is correct, red where it's wrong. All green = broken.", 160)
    + explain(isNL
      ? `<b>Why the NLFSR resists BM.</b> Berlekamp-Massey finds the shortest <i>linear</i> recurrence for a sequence. A 16-bit LFSR has linear complexity 16, so 32 bits break it. The 128-bit NLFSR's nonlinear feedback pushes its linear complexity to roughly half the sequence length, so BM would need an impractical number of clean bits — with 64 probed bits it predicts ~50%, i.e. guessing. This is the upgrade that matters once physical tampering is in scope.`
      : `<b>Why the LFSR is fragile.</b> It's linear, so Berlekamp-Massey recovers its full 16-bit state from just 32 consecutive keystream bits. The design's real defence is keeping those bits hidden: the buffer stops saturation, and the busy bitstream hides the keystream. But <b>if an attacker probes the keystream wire directly</b> (tampering), 64 bits recover it completely — see the 100% row above. The known ID alone leaks only 16 bits, which isn't enough.`);
  const c = document.querySelector("#panels canvas"); const g = dpiCanvas(c, 160);
  // show the forced-window prediction if in forced mode, else the probe prediction over first bits
  let match, startX;
  if (S.sig === "forced") { match = S.eve_match; startX = S.eve_window[1]; }
  else {
    match = new Uint8Array(N_DSM);
    const known = S.K.subarray(0, 64), { L, c: cc } = bm2(known), g2 = lfsrPredict(cc, L, known, 400);
    for (let i = 0; i < 400; i++) match[64 + i] = g2[i] === S.K[64 + i] ? 1 : 0;
    startX = 64;
  }
  const show = 300, a = axes(g.ctx, g.w, g.h, { l: 30, r: 12, t: 10, b: 26 }, [0, show], [-0.1, 1.1], { ny: 1, yfmt: v => v < .5 ? "✗" : "✓", xlabel: "keystream bit index" });
  const cw = (a.X(1) - a.X(0));
  for (let i = 0; i < show; i++) {
    const idx = startX + i; if (idx >= match.length) break;
    g.ctx.fillStyle = match[idx] ? COL.good() : COL.warn();
    g.ctx.fillRect(a.X(i), a.Y(match[idx]) - 3, Math.max(1.5, cw), 6);
  }
  c.parentElement.querySelector(".legend").innerHTML = legend([["correct prediction", COL.good()], ["wrong prediction", COL.warn()]]);
}

  s += blk({ node: "rxdb", cls: "key", x: 40, y: 690, w: 125, h: 75, title: "Key database", val: "dbv" });
  s += blk({ node: base ? "lfsr" : "nlfsr", cls: "key", x: 195, y: 690, w: 120, h: 75, title: base ? "LFSR-16" : "NLFSR-128", val: "kgrx" });
  s += label(345, 728, "The receiver holds each chip's key.", "lab key") + label(345, 746, base ? "Same key as on the chip." : "Same key the chip re-creates each power-up.", "lab key");

  // ---- wire value badges
  s += badge("bD", 803, 110, "middle", k => "D=" + S.D[k]);
  s += badge("bC", 891, 110, "middle", k => "C=" + S.C[k]);
  s += badge("bK", 869, 232, "start", k => "K=" + S.K[k]);
  s += badge("bDrx", 291, 605, "middle", k => "D=" + S.D_rx[k]);
  s += badge("bKrx", 271, 664, "start", k => "K=" + S.K_rx[k]);

  // ---- Eve
  const ex = 800, ey = 560;
  s += `<g class="blk eve" data-node="eve" tabindex="0" role="button" aria-label="Eavesdropper"><rect class="evebox" x="${ex}" y="${ey}" width="290" height="230" rx="12"/>

    <text class="lab" x="${ex + 145}" y="${ey + 40}" text-anchor="middle">sees the wire · knows the design · no key</text>
    <rect class="sbg" x="${ex + 12}" y="${ey + 52}" width="266" height="32" rx="3"/><path class="scope" id="dg-sc_eve"/>
    ${[["Known ID, 16 bits", 112, "e1"], ["Forced input (saturation)", 152, "e2"], ["Probe the key, 64 bits", 192, "e3"]].map(([t, dy, id]) => `
      <text class="v left" x="${ex + 12}" y="${ey + dy}">${t}</text><text class="v right" id="dg-${id}t" x="${ex + 278}" y="${ey + dy}" text-anchor="end"></text>
      <rect class="track" x="${ex + 12}" y="${ey + dy + 6}" width="266" height="9" rx="4"/><rect class="fill" id="dg-${id}f" x="${ex + 12}" y="${ey + dy + 6}" width="0" height="9" rx="4"/>
      <line class="half" x1="${ex + 145}" x2="${ex + 145}" y1="${ey + dy + 4}" y2="${ey + dy + 17}"/>`).join("")}
    <text class="lab" x="${ex + 145}" y="${ey + 222}" text-anchor="middle">bar = key bits predicted · dotted line = guessing</text></g>`;
  dgDyn.push({ kind: "scope", name: "sc_eve", g: { x: ex + 12, y: ey + 52, w: 266, h: 32 }, get: k => ({ arr: S.C_rx, idx: k, n: 100, lo: -0.2, hi: 1.2, digital: true }) });

  s += `</svg>`;

  // resolve elements & wire up clicks

  });

  // per-frame text values
  T("sensor", k => (S.i_sense[k] * 1e6).toFixed(2) + " µA");
  T("tia", k => S.v_tia[k].toFixed(2) + " V");
  T("s2d", k => "u = " + sgn(S.u[k]));
  T("x1", k => sgn(S.x1[k], 1)); T("x2", k => sgn(S.x2[k], 1));
  T("cmp", k => "D = " + S.D[k]);
  T("dith", k => state.dither ? "d " + sgn(S.dith[k], 3) : "off");
  T("fr", k => "next bit C = " + S.C[k]);
  T("kg", k => "K = " + S.K[k]);
  T("kgrx", k => "K = " + S.K_rx[k]);
  T("cicv", k => sgn(S.y_cic[Math.floor(k / OSR)], 2));
  T("firv", k => sgn(S.y[Math.floor(k / OSR)], 2));
  dgHighlight();
  dgDyn.forEach(d => { d.el = svg.querySelector("#dg-" + d.name); });
  // No paintRun() here: callers run the simulation next (run() -> paintRun()).
  // Painting now would read results from the previous scheme.
}

const uScale = () => Math.min(1.5, Math.max(0.3, peakAbs(S.u, 3000) * 1.25));
const xScale = () => Math.min(state.xlim * 1.15, Math.max(0.8, peakAbs(S.x2, 3000) * 1.3));
const yScale = () => (S._ys || (S._ys = Math.max(0.06, peakAbs(S.y.subarray(120), 1500) * 1.3)));

// ------------------------------------------------------------- highlight
function dgHighlight() {
  document.querySelectorAll("svg.dg [data-node]").forEach(el => {
    const on = el.dataset.node === selected;
    el.setAttribute("aria-pressed", on ? "true" : "false");
    el.classList.toggle("sel", on);
  });
}

// ------------------------------------------------------------- once per run
function paintRun() {
  const svg = document.querySelector("svg.dg");
  if (!svg || !S || S.P.scheme !== state.scheme) return;   // stale results from the other scheme
  const set = (id, txt) => { const e = svg.querySelector("#dg-" + id); if (e) e.textContent = txt; };
  const base = state.scheme === "baseline";
  svg.querySelector("#dg-dsmgrp").classList.toggle("alert", S.run >= 32 || S.clip > 0.01);
  set("idchk", S.id_ok ? "ID ✓ matches" : "ID ✗ wrong key");
  const idEl = svg.querySelector("#dg-idchk"); if (idEl) idEl.classList.toggle("bad", !S.id_ok);
  set("outv", S.sndr != null ? "SNDR " + S.sndr.toFixed(1) + " dB" : "no test tone");
  const oEl = svg.querySelector("#dg-outv"); if (oEl) oEl.classList.toggle("bad", S.sndr != null && S.sndr < 20);
  if (base) {
    set("psk", "0x" + (state.key16 & 0xFFFF).toString(16).toUpperCase().padStart(4, "0"));
    set("dbv", "key 0x" + (state.key16 & 0xFFFF).toString(16).toUpperCase());
  } else {
    set("pufv", `${S.n_err_true} bits flipped`);
    set("fev", S.fe_ok ? `fixed ${S.n_err_fixed} (max ${state.bch_t})` : `too many: ${S.n_err_true} > ${state.bch_t}`);
    set("hashv", bitsHex(S.key_tx).slice(0, 8) + "…");
    set("dbv", "key + h");
    // PUF cells: first 28 bits; red = flipped this power-up
    const g = svg.querySelector("#dg-pufcells");
    if (g) {
      let c = "";
      for (let i = 0; i < 28; i++) c += `<rect x="${48 + i * 3.7}" y="314" width="2.9" height="18" rx="1" class="${S.e_true[i] ? "cell bad" : "cell"}"/>`;
      g.innerHTML = `<rect class="sbg" x="46" y="310" width="108" height="26" rx="3"/>` + c;
    }
    const gg = svg.querySelector("#dg-fegauge");
    if (gg) {
      const fill = Math.min(1, S.n_err_true / state.bch_t), ok = S.fe_ok && S.n_err_true <= state.bch_t;
      gg.innerHTML = `<rect class="track" x="225" y="312" width="130" height="10" rx="5"/><rect class="fill ${ok ? "ok" : "bad"}" x="225" y="312" width="${(130 * fill).toFixed(1)}" height="10" rx="5"/>
        <text class="v" x="290" y="336" text-anchor="middle">${S.key_match ? "key restored ✓" : "key wrong ✗"}</text>`;
    }
  }
  const bars = [["e1", S.eve_id.acc], ["e2", S.eve_forced_best], ["e3", S.eve_probe.acc]];
  bars.forEach(([id, acc]) => {
    const f = svg.querySelector("#dg-" + id + "f"), t = svg.querySelector("#dg-" + id + "t"), broken = acc > 0.99;
    f.setAttribute("width", (266 * acc).toFixed(1)); f.setAttribute("class", "fill " + (broken ? "bad" : "ok"));
    t.textContent = (acc * 100).toFixed(0) + "%  " + (broken ? "BROKEN" : "safe"); t.classList.toggle("bad", broken);
  });
  S._ys = null; dgShown = -1;
  paintFrame(DG_K0 + Math.floor(dgPos));
}

// ------------------------------------------------------------- every animation frame
function paintFrame(k) {
  if (!S || S.P.scheme !== state.scheme || k === dgShown) return;
  dgShown = k;
  for (const d of dgDyn) {
    if (!d.el) continue;
    if (d.kind === "text") d.el.textContent = d.fn(k);
    else { const p = d.get(k); d.el.setAttribute("d", scopeD(d.g, p.arr, p.idx, p.n, p.lo, p.hi, p.digital)); }
  }
  for (const f of dgLive) f(k);
}

function dgTick(ts) {
  if (dgPlaying && S) {
    const dt = Math.min(0.1, (ts - dgLast) / 1000);
    dgPos = (dgPos + dgRate * dt) % DG_LEN;
    paintFrame(DG_K0 + Math.floor(dgPos));
  }
  dgLast = ts;
  dgRaf = requestAnimationFrame(dgTick);
}

function buildDiagramCard() {
  const reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  document.getElementById("diagramCard").innerHTML = `
    <div class="dg-head">
      <div><h2>The whole system, live</h2>
        <p>Click any block to open it. Each little scope shows that block's signal over the last few clock ticks.</p></div>
      <div class="dg-tools">
        <button id="dgPlay" class="tool" aria-pressed="${dgPlaying}">${dgPlaying ? "Pause" : "Play"}</button>
        <button id="dgStep" class="tool">Step</button>
        <button id="dgScope" class="tool" aria-pressed="false" title="Plot every probe point on one time axis">All signals</button>
        <label class="speed">Speed <select id="dgSpeed"><option value="8">Slow</option><option value="40" selected>Normal</option><option value="160">Fast</option></select></label>
      </div>
    </div>
    ${reduced ? '<p class="dg-note">Your device asks for reduced motion, so the animation starts paused. Press Play to run it.</p>' : ""}
    <p class="dg-swipe">Swipe sideways to see the whole diagram.</p>
    <div class="dg-scroll" id="dgSvg"></div>
    <div class="legend dg-legend">
      <span><i class="swatch" style="background:var(--sig)"></i>analog signal</span>
      <span><i class="swatch" style="background:var(--ink)"></i>data bits</span>
      <span><i class="swatch" style="background:var(--key)"></i>key bits</span>
      <span><i class="swatch dashed" style="border-color:var(--key)"></i>public helper data</span>
      <span><i class="swatch" style="background:var(--ink-faint)"></i>wireless channel</span>
    </div>`;
  document.getElementById("dgPlay").onclick = e => { dgPlaying = !dgPlaying; e.target.textContent = dgPlaying ? "Pause" : "Play"; e.target.setAttribute("aria-pressed", dgPlaying); document.querySelector("svg.dg").classList.toggle("paused", !dgPlaying); };
  document.getElementById("dgStep").onclick = () => { dgPlaying = false; const p = document.getElementById("dgPlay"); p.textContent = "Play"; document.querySelector("svg.dg").classList.add("paused"); dgPos = (dgPos + 1) % DG_LEN; paintFrame(DG_K0 + Math.floor(dgPos)); };
  document.getElementById("dgSpeed").onchange = e => { dgRate = +e.target.value; };
  document.getElementById("dgScope").onclick = () => selectNode("scope");
  if (!dgRaf) dgRaf = requestAnimationFrame(dgTick);
}
