<script>
// =====================================================================
// inspector.js: the docked panel at the bottom of the screen
//
// The schematic is about 760 px tall at page width, so it cannot stay on screen next to a
// block's plots if both live in the page flow. Instead the plots and the explanation live in
// this fixed panel. Clicking a block fills it in and opens it; the diagram never moves.
//
//   openInspector() / closeInspector()   show or fold the panel (folded = a one-line bar)
//   layoutInspector()                    sets --insp-h so the page and sidebar leave room for it
//   setHH()                              sets --hh, the height of the sticky header
// =====================================================================
let inspOpen = false, inspTall = false;

function inspHeights() {
  const vh = window.innerHeight;
  return { closed: 57, open: Math.round(Math.min(Math.max(300, vh * 0.44), 520)), tall: Math.round(Math.min(vh * 0.78, 760)) };
}
function layoutInspector() {
  const el = document.getElementById("inspector"), h = inspHeights();
  document.documentElement.style.setProperty("--insp-h", (inspOpen ? (inspTall ? h.tall : h.open) : h.closed) + "px");
  el.dataset.open = String(inspOpen); el.dataset.tall = String(inspTall);
  document.getElementById("inspToggle").setAttribute("aria-expanded", String(inspOpen));
  document.getElementById("inspSize").textContent = inspTall ? "Shorter" : "Taller";
}
function openInspector() { if (!inspOpen) { inspOpen = true; layoutInspector(); } }
function closeInspector() { if (inspOpen) { inspOpen = false; layoutInspector(); } }

function setHH() {
  const hd = document.querySelector("header");
  document.documentElement.style.setProperty("--hh", (getComputedStyle(hd).position === "sticky" ? hd.offsetHeight : 0) + "px");
}

function initInspector() {
  document.getElementById("inspToggle").onclick = () => (inspOpen ? closeInspector() : openInspector());
  document.getElementById("inspSize").onclick = () => { inspTall = !inspTall; layoutInspector(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && inspOpen) closeInspector(); });
  let t = null;
  window.addEventListener("resize", () => { setHH(); layoutInspector(); clearTimeout(t); t = setTimeout(() => { if (S) renderPanels(); }, 120); });
  setHH(); layoutInspector();
}

</script>
<script>
// ===== APP-START =====
const state = { ...DEFAULTS };
let S = null, selected = "afe_out", raf = null;

// ---- helpers to read theme colors
const CSS = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const COL = { sig: () => CSS("--sig"), sigd: () => CSS("--sig-dim"), key: () => CSS("--key"),
  keyd: () => CSS("--key-dim"), grid: () => CSS("--grid"), ink: () => CSS("--ink-soft"),
  faint: () => CSS("--ink-faint"), warn: () => CSS("--warn"), good: () => CSS("--good") };

// ---------------------------------------------------------------- controls
const CONTROLS = [
  { h: "Input signal" },
  { k: "sig", t: "seg", label: "Source", opts: [["sine", "Sine"], ["dc", "DC"], ["forced", "Attack"], ["zero", "Zero"]] },
  { k: "amp_uA", t: "range", label: "Sine amplitude", min: 0.05, max: 1.2, step: 0.01, unit: "µA", show: p => p.sig === "sine" },
  { k: "bin", t: "range", label: "Sine frequency", min: 40, max: 900, step: 1, unit: "→ kHz", fmt: v => (v * FS_OUT / N_FFT / 1e3).toFixed(1), show: p => p.sig === "sine" },
  { k: "dc_uA", t: "range", label: "DC level", min: -1.0, max: 1.0, step: 0.02, unit: "µA", show: p => p.sig === "dc" },
  { k: "force_uA", t: "range", label: "Forced current", min: 0.5, max: 20, step: 0.5, unit: "µA", show: p => p.sig === "forced" },
  { h: "Analog front end" },
  { k: "rtia", t: "select", label: "TIA gain", opts: [[3300, "3.30 kΩ"], [31810, "31.8 kΩ"], [321880, "322 kΩ"], [3055220, "3.06 MΩ"]] },
  { k: "buffer", t: "seg", label: "S2D buffer", opts: [[0.5, "×0.5 (on)"], [1.0, "×1 (off)"]], hint: "Turning the halving off is what lets a forced input saturate the DSM." },
  { h: "Delta-sigma modulator" },
  { k: "dither", t: "chk", label: "Dither enabled" },
  { k: "dither_amp", t: "range", min: 0.01, max: 0.4, step: 0.005, label: "Dither strength", unit: "×ref", show: p => p.dither },
  { k: "xlim", t: "range", min: 0.8, max: 3.0, step: 0.1, label: "Integrator rail", unit: "" },
  { h: "Security", scheme: "baseline" },
  { k: "key16", t: "range", min: 1, max: 65535, step: 1, label: "Pre-shared key", fmt: v => "0x" + (v & 0xFFFF).toString(16).toUpperCase(), scheme: "baseline" },
  { h: "PUF + key", scheme: "proposed" },
  { k: "chip_seed", t: "range", min: 1, max: 40, step: 1, label: "Chip # (PUF identity)", scheme: "proposed" },
  { k: "temp", t: "range", min: -20, max: 125, step: 1, label: "Temperature", unit: "°C", scheme: "proposed" },
  { k: "puf_sigma", t: "range", min: 0.02, max: 0.14, step: 0.005, label: "PUF noise σ", scheme: "proposed", hint: "Higher σ = more unstable PUF bits per power-up." },
  { k: "bch_t", t: "range", min: 10, max: 60, step: 1, label: "BCH correction t", scheme: "proposed", hint: "Bits the ECC can fix. Below the PUF error count, the key fails." },
  { k: "h_tamper", t: "range", min: 0, max: 120, step: 1, label: "Tamper helper data", unit: "bits", scheme: "proposed", hint: "Attacker flips bits in h in transit. Any flip breaks the key → Rx catches it." },
  { h: "Channel & receiver" },
  { k: "ber", t: "range", min: 0, max: 0.02, step: 0.0005, label: "Channel bit-error rate", fmt: v => (v * 100).toFixed(2) + "%" },
  { k: "rx_wrong_key", t: "chk", label: "Rx uses wrong key" },
];

function buildControls() {
  const c = document.getElementById("controls");
  c.innerHTML = "";
  for (const item of CONTROLS) {
    if (item.scheme && item.scheme !== state.scheme) continue;
    if (item.h) { const h = document.createElement("h3"); h.textContent = item.h; c.appendChild(h); continue; }
    if (item.show && !item.show(state)) continue;
    const div = document.createElement("div"); div.className = "ctl";
    if (item.t === "range") {
      const val = state[item.k], disp = item.fmt ? item.fmt(val) : val + (item.unit ? " " + item.unit : "");
      div.innerHTML = `<label>${item.label}<b id="lab_${item.k}">${disp}</b></label>`;
      const r = document.createElement("input");
      r.type = "range"; r.min = item.min; r.max = item.max; r.step = item.step; r.value = val;
      r.oninput = () => { state[item.k] = parseFloat(r.value); document.getElementById("lab_" + item.k).textContent = item.fmt ? item.fmt(state[item.k]) : state[item.k] + (item.unit ? " " + item.unit : ""); schedule(); };
      div.appendChild(r);
    } else if (item.t === "select") {
      div.innerHTML = `<label>${item.label}</label>`;
      const s = document.createElement("select");
      for (const [v, t] of item.opts) { const o = document.createElement("option"); o.value = v; o.textContent = t; if (+v === +state[item.k]) o.selected = true; s.appendChild(o); }
      s.onchange = () => { state[item.k] = parseFloat(s.value); schedule(); };
      div.appendChild(s);
    } else if (item.t === "seg") {
      div.innerHTML = `<label>${item.label}</label>`;
      const seg = document.createElement("div"); seg.className = "seg";
      for (const [v, t] of item.opts) {
        const b = document.createElement("button"); b.textContent = t;
        b.setAttribute("aria-pressed", String(state[item.k] == v));
        b.onclick = () => { state[item.k] = typeof v === "number" ? v : v; buildControls(); schedule(); };
        seg.appendChild(b);
      }
      div.appendChild(seg);
    } else if (item.t === "chk") {
      div.innerHTML = `<label class="chk"><input type="checkbox" ${state[item.k] ? "checked" : ""}> ${item.label}</label>`;
      div.querySelector("input").onchange = e => { state[item.k] = e.target.checked; buildControls(); schedule(); };
    }
    if (item.hint) { const h = document.createElement("div"); h.className = "hint"; h.textContent = item.hint; div.appendChild(h); }
    c.appendChild(div);
  }
  const rb = document.createElement("button"); rb.className = "reset"; rb.textContent = "Reset to defaults";
  rb.onclick = () => { Object.assign(state, DEFAULTS); buildControls(); schedule(); };
  c.appendChild(rb);
}

// ---------------------------------------------------------------- selection
// Blocks that only exist in one design. If the user flips designs while one of these
// is open, jump to the equivalent block.
const ONLY = { baseline: ["psk", "lfsr"], proposed: ["puf", "fe", "keyd", "nlfsr"] };

function selectNode(id, opts) {
  selected = id; infoOpen = true;
  dgHighlight();
  const sb = document.getElementById("dgScope"); if (sb) sb.setAttribute("aria-pressed", String(id === "scope"));
  if (!(opts && opts.quiet)) openInspector();      // the block's plots open in the docked inspector
  renderPanels();
}

// ---------------------------------------------------------------- canvas plotting
function dpiCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 600;
  if (cv._w !== w || cv._h !== h || cv._d !== dpr) { cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + "px"; cv._w = w; cv._h = h; cv._d = dpr; }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, w, h };   // reuse the bitmap: live plots redraw every frame
}
function axes(ctx, w, h, pad, xr, yr, opt = {}) {
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = COL.grid(); ctx.fillStyle = COL.faint(); ctx.lineWidth = 1;
  ctx.font = "11px " + CSS("--mono");
  const X = x => pad.l + (x - xr[0]) / (xr[1] - xr[0]) * (w - pad.l - pad.r);
  const Y = y => h - pad.b - (y - yr[0]) / (yr[1] - yr[0]) * (h - pad.t - pad.b);
  const ny = opt.ny || 4;
  for (let i = 0; i <= ny; i++) {
    const yy = yr[0] + (yr[1] - yr[0]) * i / ny, py = Y(yy);
    ctx.strokeStyle = COL.grid(); ctx.beginPath(); ctx.moveTo(pad.l, py); ctx.lineTo(w - pad.r, py); ctx.stroke();
    ctx.fillStyle = COL.faint(); ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(opt.yfmt ? opt.yfmt(yy) : yy.toFixed(2), pad.l - 6, py);
  }
  if (opt.xticks) for (const [xx, lab] of opt.xticks) { ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = COL.faint(); ctx.fillText(lab, X(xx), h - pad.b + 5); }
  if (opt.xlabel) { ctx.textAlign = "center"; ctx.fillStyle = COL.ink(); ctx.fillText(opt.xlabel, (pad.l + w - pad.r) / 2, h - 12); }
  return { X, Y };
}
function line(ctx, xs, ys, X, Y, color, wdt = 1.5) {
  ctx.strokeStyle = color; ctx.lineWidth = wdt; ctx.beginPath();
  for (let i = 0; i < ys.length; i++) { const px = X(xs ? xs[i] : i), py = Y(ys[i]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke();
}
function stepDigital(ctx, bits, off, count, X, Y, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.beginPath();
  for (let i = 0; i < count; i++) {
    const b = bits[off + i], x0 = X(i), x1 = X(i + 1), y = Y(b);
    if (i === 0) ctx.moveTo(x0, y); else { ctx.lineTo(x0, Y(bits[off + i - 1])); ctx.lineTo(x0, y); }
    ctx.lineTo(x1, y);
  }
  ctx.stroke();
}

// small helpers
function fmtBits(bits, off, n) { let s = ""; for (let i = 0; i < n; i++) s += bits[off + i]; return s; }
function pill(ok, tOk, tNo) { return `<span class="pill ${ok ? "good" : "warn"}">${ok ? tOk : tNo}</span>`; }

function schedule() { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { run(); }); }
function run() {
  S = simulate(state);
  renderVerdict(); renderPanels(); paintRun();
}

function setScheme(sc) {
  state.scheme = sc;
  document.getElementById("sc-base").setAttribute("aria-pressed", sc === "baseline");
  document.getElementById("sc-prop").setAttribute("aria-pressed", sc === "proposed");
  const other = sc === "baseline" ? "proposed" : "baseline";
  if (ONLY[other].includes(selected)) selected = sc === "baseline" ? "lfsr" : "nlfsr";
  buildControls(); buildDiagram(); run();
}

// ---------------------------------------------------------------- scenarios ("story")
// Each one sets the controls, opens a block, and says in one sentence what to look at.
const SCEN = [
  { t: "Normal link", s: { ...DEFAULTS, scheme: "proposed" }, sel: "dsm_out",
    cap: "<b>Normal operation.</b> The sensor signal is turned into bits, scrambled with a key, sent over the air, and un-scrambled at the receiver. Press play and watch the bits move; the recovered signal at the bottom right is clean." },
  { t: "Wrong key at receiver", s: { ...DEFAULTS, scheme: "proposed", rx_wrong_key: true }, sel: "rx_out",
    cap: "<b>Wrong key.</b> Give the receiver even a slightly different key and the ID check fails and the output is pure noise. A wrong key does not give a nearly-right answer." },
  { t: "Attack: saturate, buffer ON", s: { ...DEFAULTS, scheme: "baseline", sig: "forced", force_uA: 15, buffer: 0.5 }, sel: "s2d_out",
    cap: "<b>An attacker forces a huge input.</b> The S2D buffer halves it, so the modulator stays in control and its bits keep toggling. The key stays hidden (Eve's bar stays low)." },
  { t: "Attack: saturate, buffer OFF", s: { ...DEFAULTS, scheme: "baseline", sig: "forced", force_uA: 15, buffer: 1.0 }, sel: "dsm_out",
    cap: "<b>Same attack, buffer removed.</b> The modulator saturates (see the red loop) and its output freezes at all 1s. Now the encrypted bits are just the key flipped, and the attacker reads the key straight off the wire." },
  { t: "Probe the key: original", s: { ...DEFAULTS, scheme: "baseline" }, sel: "lfsr",
    cap: "<b>Physical tampering, original design.</b> If an attacker can read even 64 key bits off the chip, the 16-bit LFSR is fully predictable: Eve's third bar goes to 100%." },
  { t: "Probe the key: our proposal", s: { ...DEFAULTS, scheme: "proposed" }, sel: "nlfsr",
    cap: "<b>Same tampering, our proposal.</b> A 128-bit non-linear generator seeded from the chip's PUF. The same 64 leaked bits let Eve guess no better than a coin flip (about 50%)." },
  { t: "Hot chip (85°C)", s: { ...DEFAULTS, scheme: "proposed", temp: 85 }, sel: "fe",
    cap: "<b>The fingerprint gets noisier when hot.</b> More PUF bits flip, but the error-correcting code still restores the exact key (the gauge stays inside its limit)." },
  { t: "Too many flips", s: { ...DEFAULTS, scheme: "proposed", temp: 115, bch_t: 15 }, sel: "fe",
    cap: "<b>What if the code is too weak?</b> When the flips exceed what the code can fix, the key comes out wrong and the receiver's ID check catches it. So you size the code for the worst case." },
  { t: "Tampered helper data", s: { ...DEFAULTS, scheme: "proposed", h_tamper: 30 }, sel: "fe",
    cap: "<b>Attacker alters the public helper data in transit.</b> The chip reconstructs a wrong key, and the receiver notices immediately. Public does not mean unprotected." },
];
let scnActive = 0;
function applyScenario(i) {
  const sc = SCEN[i]; scnActive = i;
  Object.assign(state, sc.s); if (sc.sel) { selected = sc.sel; openInspector(); } infoOpen = true;
  document.getElementById("sc-base").setAttribute("aria-pressed", state.scheme === "baseline");
  document.getElementById("sc-prop").setAttribute("aria-pressed", state.scheme === "proposed");
  document.querySelectorAll("#scnBtns button").forEach((b, n) => b.setAttribute("aria-pressed", n === i));
  document.getElementById("caption").innerHTML = sc.cap;
  buildControls(); buildDiagram(); run();
}
function buildScenarios() {
  const c = document.getElementById("scnBtns");
  SCEN.forEach((sc, i) => { const b = document.createElement("button"); b.textContent = sc.t; b.setAttribute("aria-pressed", i === 0); b.onclick = () => applyScenario(i); c.appendChild(b); });
  document.getElementById("caption").innerHTML = SCEN[0].cap;
}

function renderVerdict() {
  const v = document.getElementById("verdict"), items = [];
  items.push({ k: "Rx ID check", v: S.id_ok ? "PASS" : "FAIL", cls: S.id_ok ? "good" : "warn", d: S.sync_pos >= 0 ? "frame synced" : "no sync" });
  items.push({ k: "Recovered SNDR", v: S.sndr != null ? S.sndr.toFixed(1) + " dB" : "—", d: S.sndr != null ? (S.sndr > 40 ? "clean signal" : "buried in noise") : "not a sine" });
  const evilBroken = S.eve_forced_broken > 0.5 || S.eve_probe.acc > 0.99;
  if (state.scheme === "baseline") {
    items.push({ k: "Keystream vs BM", v: S.eve_probe.acc > 0.99 ? "BROKEN" : (S.eve_forced_broken > 0.5 ? "BROKEN" : "safe"), cls: S.eve_probe.acc > 0.99 ? "warn" : "good", d: "probe recovers LFSR" });
  } else {
    items.push({ k: "PUF key", v: S.key_match ? "OK" : "FAIL", cls: S.key_match ? "good" : "warn", d: `${S.n_err_true} flips, t=${state.bch_t}` });
    items.push({ k: "Probe vs NLFSR", v: S.eve_probe.acc > 0.99 ? "broken" : "resists", cls: S.eve_probe.acc > 0.99 ? "warn" : "good", d: `BM predicts ${(S.eve_probe.acc * 100).toFixed(0)}%` });
  }
  items.push({ k: "DSM output", v: (S.ones * 100).toFixed(0) + "% ones", d: "longest run " + S.run + " bits" });
  v.innerHTML = items.map(i => `<div class="vcard"><div class="k">${i.k}</div><div class="v ${i.cls || ""}">${i.v}</div><div class="d">${i.d}</div></div>`).join("");
}
// ===== APP-MID =====

// ---------------------------------------------------------------- boot
initInspector();
buildScenarios();
buildDiagramCard();
setScheme("proposed");
selectNode("dsm_out", { quiet: true });      // pre-select a block but leave the inspector folded
document.getElementById("themeBtn").addEventListener("click", () => {
  const r = document.documentElement, n = r.getAttribute("data-theme") === "dark" ? "light" : "dark";
  r.setAttribute("data-theme", n); try { localStorage.setItem("theme", n); } catch (e) {}
  buildDiagram(); renderPanels(); paintRun(); dgHighlight();   // canvases read the palette when they draw
});
if (document.fonts) document.fonts.ready.then(() => { setHH(); renderPanels(); });

</script>
