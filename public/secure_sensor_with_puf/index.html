<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>

<title>Secure DSM + PUF — signal path explorer</title>
<style>
@font-face{font-family:"KaTeX_Main";src:url("/fonts/KaTeX_Main-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"KaTeX_Main";src:url("/fonts/KaTeX_Main-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"KaTeX_Main";src:url("/fonts/KaTeX_Main-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"KaTeX_Typewriter";src:url("/fonts/KaTeX_Typewriter-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* Palette shared with the other nithinpuru.github.io tools (Quant Terminal family);
   light/dark follows html[data-theme] and localStorage "theme". */
:root,:root[data-theme="light"]{
  color-scheme:light;
  --ink:#131c28; --ink-soft:#3d4756; --ink-faint:#5b6676; --on-ink:#ffffff;
  --paper:#f4f6f9; --panel:#ffffff; --line:rgba(19,28,40,.16); --line-soft:rgba(19,28,40,.09);
  --sig:#1f4fd1;        /* accent blue - data path */
  --sig-dim:rgba(31,79,209,.45); --sig-bg:rgba(31,79,209,.08);
  --key:#b42318;        /* red - key/security path */
  --key-dim:rgba(180,35,24,.45); --key-bg:rgba(180,35,24,.08);
  --warn:#b42318; --warn-bg:rgba(180,35,24,.1); --warn-line:rgba(180,35,24,.35);
  --good:#077a5d; --good-bg:rgba(11,138,107,.1); --good-line:rgba(11,138,107,.35);
  --grid:rgba(19,28,40,.09);
  --code-bg:#131c28; --code-ink:#e6ebf2;
  --shadow:rgba(19,28,40,.45);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f2f5fa; --ink-soft:#cfd7e3; --ink-faint:#95a1b3; --on-ink:#0f1620;
  --paper:#0f1620; --panel:#172131; --line:rgba(242,245,250,.14); --line-soft:rgba(242,245,250,.08);
  --sig:#7aa7ff; --sig-dim:rgba(122,167,255,.45); --sig-bg:rgba(122,167,255,.12);
  --key:#ff8a7a; --key-dim:rgba(255,138,122,.45); --key-bg:rgba(255,138,122,.12);
  --warn:#ff8a7a; --warn-bg:rgba(255,138,122,.12); --warn-line:rgba(255,138,122,.35);
  --good:#4fd1a8; --good-bg:rgba(79,209,168,.12); --good-line:rgba(79,209,168,.35);
  --grid:rgba(242,245,250,.08);
  --code-bg:#0b1119; --code-ink:#dbe3ee;
  --shadow:rgba(0,0,0,.7);
}
:root{
  --mono:"KaTeX_Typewriter","Latin Modern Mono","Courier New",monospace;
  --sans:"KaTeX_Main","Latin Modern Roman",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--sig);color:var(--on-ink)}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
button,input,select{font:inherit}
h1,h2,h3{font-weight:700;letter-spacing:-0.01em;margin:0}
a{color:var(--sig)}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px 80px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:40}
.hbar{max-width:1500px;margin:0 auto;padding:14px 20px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.hbar h1{font-size:19px}
.hbar .sub{color:var(--ink-soft);font-size:13.5px}
.scheme-toggle{margin-left:auto;display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.scheme-toggle button{border:0;background:var(--panel);color:var(--ink-soft);padding:7px 16px;font-family:var(--sans);
  font-size:13.5px;font-weight:400;cursor:pointer}
.scheme-toggle button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13.5px}
.theme-btn:hover{border-color:var(--sig);color:var(--sig)}
.theme-btn svg{width:15px;height:15px}

.layout{display:grid;grid-template-columns:288px 1fr;gap:24px;padding-top:22px}
@media(max-width:1080px){.layout{grid-template-columns:1fr}.controls{position:static;max-height:none}}
main{min-width:0}
.info-body>*,.panels>*,.panel{min-width:0}
pre.model{max-width:100%}
@media(max-width:700px){header{position:static}.hbar{padding:10px 14px}.wrap{padding:0 12px 60px}}

/* controls */
.controls{position:sticky;top:calc(var(--hh,60px) + 12px);align-self:start;max-height:calc(100vh - var(--hh,60px) - 28px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.controls h3{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);
  margin:18px 0 10px;font-weight:700}
.controls h3:first-child{margin-top:0}
.ctl{margin-bottom:13px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
.ctl label b{color:var(--ink);font-family:var(--mono);font-weight:400;font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--sig);height:20px}
select,.seg{width:100%;font-family:var(--sans);font-size:13.5px;padding:7px 9px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper);color:var(--ink)}
.seg{display:flex;gap:4px;padding:4px;background:var(--paper)}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:6px;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;color:var(--ink-soft)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px var(--line);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;margin-bottom:9px}
.chk input{accent-color:var(--key);width:16px;height:16px}
.reset{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
  padding:8px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13px}
.hint{font-size:11.5px;color:var(--ink-faint);line-height:1.4;margin-top:3px}

/* verdict strip */
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.vcard .k{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint)}
.vcard .v{font-size:22px;font-weight:700;font-family:var(--mono);margin-top:3px;letter-spacing:-0.02em}
.vcard .d{font-size:12px;color:var(--ink-soft);margin-top:2px}
.v.good{color:var(--good)} .v.warn{color:var(--warn)}

/* pinned dock: transport + pipeline */
.dock{position:sticky;top:var(--hh,60px);z-index:25;background:var(--paper);padding:2px 0 12px;margin-bottom:6px}
.dock-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 18px -14px var(--shadow)}
.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  display:inline-grid;place-items:center;cursor:pointer;padding:0;font-family:var(--sans);font-size:12px}
.iconbtn:hover{border-color:var(--sig)}
.iconbtn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.iconbtn svg{width:16px;height:16px;fill:currentColor}
.txtbtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
  cursor:pointer;font-family:var(--sans);font-size:12.5px}
.txtbtn[aria-pressed=true]{background:var(--sig);border-color:var(--sig);color:var(--on-ink)}
.tspeed{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft)}
.tspeed input{width:96px}
.tspeed b{font-family:var(--mono);font-weight:400;color:var(--ink);min-width:38px}
.scrubwrap{flex:1;min-width:150px;display:flex;flex-direction:column;gap:1px}
.scrubwrap input{width:100%}
.tpos{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);white-space:nowrap}
.chip b{font-weight:700}
.chip.good{color:var(--good);border-color:var(--good-line);background:var(--good-bg)}
.chip.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.dock-scroll{overflow-x:auto;padding:10px 12px 10px}
.dock-inner{position:relative;min-width:920px}
.dock-inner.arc{padding-bottom:50px}
.lane{display:grid;grid-template-columns:40px repeat(8,minmax(0,1fr));gap:8px;margin-bottom:10px}
.lane:last-of-type{margin-bottom:0}
.lanetag{align-self:center;font-size:11.5px;color:var(--ink-faint)}
.node{position:relative;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);padding:5px 6px 16px;
  text-align:center;cursor:pointer;min-height:60px;transition:border-color .12s,background .12s}
.node:hover{border-color:var(--sig-dim)}
.node.key:hover{border-color:var(--key-dim)}
.node[aria-selected=true]{border-color:var(--sig);background:var(--sig-bg)}
.node.key[aria-selected=true]{border-color:var(--key);background:var(--key-bg)}
.node:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.node.key{border-style:dashed}
.node .nt{font-size:12px;font-weight:700;line-height:1.15}
.node .nv{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:4px;min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#flow{position:absolute;left:0;top:0;pointer-events:none}

/* main panels */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.panels{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
.panel.wide{grid-column:1/-1}
.panel h2{font-size:15px;margin-bottom:2px}

.panel .cap{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
.panel .cap b{color:var(--ink);font-weight:700}
canvas{width:100%;display:block;border-radius:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:9px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:14px;height:3px;border-radius:2px;display:inline-block}
.bitrow{font-family:var(--mono);font-size:12px;line-height:1.9;word-break:break-all;color:var(--ink-soft)}
.bitrow b{color:var(--ink)}
.explain{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--ink-soft)}
.explain b{color:var(--ink)}
.explain code{font-family:var(--mono);font-size:12.5px;background:var(--panel);padding:1px 5px;border-radius:4px;border:1px solid var(--line-soft)}
.tag{display:inline-block;font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:5px;margin-right:6px}
.tag.data{background:var(--sig-bg);color:var(--sig)}
.tag.key{background:var(--key-bg);color:var(--key)}
table.mini{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.mini td,table.mini th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line-soft)}
table.mini th{color:var(--ink-faint);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em}
table.mini td.n{font-family:var(--mono);text-align:right}
.pill{font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:700}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.foot{margin-top:24px;font-size:12px;color:var(--ink-faint);line-height:1.6}

/* summary strip above the plots */
.lede{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--sig);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.lede.key{border-left-color:var(--key)}
.lede h2{font-size:16px}
.lede p{margin:0;flex:1 1 340px;font-size:13.5px;color:var(--ink-soft)}
.lede .more{border:0;background:none;color:var(--sig);font-family:var(--sans);font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
/* block info card */
#blockInfo{margin:18px 0}
details.info{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sig);border-radius:12px}
details.info.key{border-left-color:var(--key)}
details.info>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
details.info>summary::-webkit-details-marker{display:none}
details.info>summary::before{content:"\25B8";color:var(--ink-faint);display:inline-block;transition:transform .15s}
details.info[open]>summary::before{transform:rotate(90deg)}
details.info h2{font-size:17px;margin:0}
details.info .where{font-size:12.5px;color:var(--ink-faint)}
details.info .hide{margin-left:auto;font-size:12px;color:var(--ink-faint)}
details.info:not([open]) .hide::after{content:"show explanation"}
details.info[open] .hide::after{content:"hide"}
.info-body{padding:2px 18px 18px;display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
@media(max-width:900px){.info-body{grid-template-columns:1fr}}
.info-body h4{margin:0 0 5px;font-size:12.5px;color:var(--ink-faint);font-weight:700}
.info-body p{margin:0 0 14px;font-size:14px;color:var(--ink-soft)}
.info-body p.big{font-size:15.5px;color:var(--ink);line-height:1.55}
.info-body ul{margin:0 0 14px;padding-left:18px;font-size:13.5px;color:var(--ink-soft)}
.info-body li{margin-bottom:5px}
.io{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-bottom:14px}
.io .b{background:var(--paper);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.io .b b{color:var(--ink)}
.io .arr{align-self:center;color:var(--ink-faint)}
@media(max-width:560px){.io{grid-template-columns:1fr}.io .arr{transform:rotate(90deg);justify-self:center}}
pre.model{margin:0 0 14px;padding:11px 13px;background:var(--code-bg);color:var(--code-ink);border-radius:8px;font-family:var(--mono);
  font-size:12px;line-height:1.65;overflow-x:auto;white-space:pre}
details.gloss{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.gloss summary{cursor:pointer;font-weight:700;font-size:14px}
details.gloss dl{margin:12px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:13.5px;color:var(--ink-soft)}
details.gloss dt{font-weight:700;color:var(--ink)}
details.gloss dd{margin:0}
.scn-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.scn-btns button{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:7px 13px;
  border-radius:20px;cursor:pointer;font-family:var(--sans);font-size:12.5px}
.scn-btns button:hover{border-color:var(--sig);color:var(--sig)}
</style>

<body>
<header>
  <div class="hbar">
    <h1>Secure&nbsp;DSM&nbsp;+&nbsp;PUF</h1>
    <span class="sub">signal-path explorer · click any block to probe it</span>
    <div class="scheme-toggle" role="group" aria-label="Scheme">
      <button id="sc-base" onclick="setScheme('baseline')">Baseline (ESSERC'25)</button>
      <button id="sc-prop" onclick="setScheme('proposed')" aria-pressed="true">Proposed (PUF + NLFSR)</button>
    </div>
    <button class="theme-btn" type="button" id="themeBtn" aria-label="Switch colour theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>Theme</button>
  </div>
</header>
<div class="wrap">
  <div class="scn-btns" id="scnBtns"></div>
  <div class="verdict" id="verdict"></div>
  <div class="layout">
    <aside class="controls" id="controls"></aside>
    <main>
      <div class="dock" id="dock">
        <div class="dock-card">
          <div class="transport">
            <button class="iconbtn primary" id="btnPlay" aria-label="Pause" title="Play / pause (space)"></button>
            <button class="iconbtn" id="btnBack" aria-label="Step back" title="Step back">
              <svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
            <button class="iconbtn" id="btnFwd" aria-label="Step forward" title="Step forward">
              <svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2l8 6-8 6z"/></svg></button>
            <button class="iconbtn" id="btnRestart" aria-label="Restart" title="Restart">
              <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 5.7 4h-2A4 4 0 1 1 8 4v2.5L12 3.2 8 0z"/></svg></button>
            <label class="tspeed">Speed <input type="range" id="spd" min="-2" max="3" step="0.25" value="0" aria-label="Animation speed"><b id="spdLbl">1×</b></label>
            <div class="scrubwrap"><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Time position"><span class="tpos" id="tpos"></span></div>
            <button class="txtbtn" id="btnScope" title="Plot every probe point on one time axis">All signals</button>
            <div class="mini" id="mini"></div>
          </div>
          <div class="dock-scroll"><div class="dock-inner" id="dockInner"><div id="lanes"></div></div></div>
        </div>
      </div>
      <div id="blockLede"></div>

<script>// ===== CORE-START =====
// Behavioural model of the S-DSM link (baseline) and the SRAM-PUF + NLFSR proposal.
// Same model as the Python version, ported so every node can be probed in the browser.

const FS = 10e6, OSR = 50, FS_OUT = FS / OSR, VDD = 1.2, VCM = 0.6;
const N_FFT = 2048, N_OUT = N_FFT + 100, N_DSM = N_OUT * OSR;
const PUF_BITS = 600, ID_BITS = 16;
const PREAMBLE = Uint8Array.from({ length: 32 }, (_, i) => (i % 2 ? 0 : 1));
const SYNC = Uint8Array.from((0xB5E3).toString(2).padStart(16, "0"), c => +c);

// ---------- random numbers (seeded, so every run is repeatable)
function makeRng(seed) {
  let a = seed >>> 0, spare = null;
  const u = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    u,
    int: n => Math.floor(u() * n),
    n() {
      if (spare !== null) { const s = spare; spare = null; return s; }
      let x, y, s;
      do { x = u() * 2 - 1; y = u() * 2 - 1; s = x * x + y * y; } while (s >= 1 || s === 0);
      const m = Math.sqrt(-2 * Math.log(s) / s);
      spare = y * m; return x * m;
    },
  };
}

// ---------- keystream generators
class LFSR16 {                       // x^16 + x^14 + x^13 + x^11 + 1 (stand-in polynomial)
  constructor(seed) { this.s = (seed & 0xFFFF) || 1; }
  bit() {
    const s = this.s, fb = (s ^ (s >> 2) ^ (s >> 3) ^ (s >> 5)) & 1;
    this.s = (s >> 1) | (fb << 15); return s & 1;
  }
  bits(n) { const o = new Uint8Array(n); for (let i = 0; i < n; i++) o[i] = this.bit(); return o; }
}

class NLFSR128 {                     // feedback taps borrowed from Grain-128's NFSR (illustrative)
  constructor(keyBits) {
    this.s = Uint8Array.from(keyBits.slice(0, 128));
    if (!this.s.some(x => x)) this.s[0] = 1;
    this.p = 0;
    for (let i = 0; i < 256; i++) this.bit();       // warm-up mixes the key
  }
  bit() {
    const s = this.s, p = this.p, b = i => s[(p + i) & 127];
    const out = s[p];
    const fb = b(0) ^ b(26) ^ b(56) ^ b(91) ^ b(96)
      ^ (b(3) & b(67)) ^ (b(11) & b(13)) ^ (b(17) & b(18))
      ^ (b(27) & b(59)) ^ (b(40) & b(48)) ^ (b(61) & b(65)) ^ (b(68) & b(84));
    s[p] = fb; this.p = (p + 1) & 127; return out;

// ---------- analog front end
const tia = (i, r) => Math.min(VDD, Math.max(0, VCM + i * r));
const s2d = (v, g) => g * (v - VCM) / (VDD / 2);

// ---------- 2nd-order 1-bit DSM (Boser-Wooley), dither at the comparator decision
function dsm2(u, o, rng) {
  const n = u.length, D = new Uint8Array(n), X1 = new Float32Array(n), X2 = new Float32Array(n), DI = new Float32Array(n);
  const l1 = new LFSR16(o.seeds[0]), l2 = new LFSR16(o.seeds[1]);
  let x1 = 0, x2 = 0, y = 1, clip = 0;
  for (let k = 0; k < n; k++) {
    const v = y ? 1 : -1;
    x1 += 0.5 * (u[k] - v);
    x2 += 0.5 * (x1 - v);
    if (Math.abs(x1) > o.xlim || Math.abs(x2) > o.xlim) {
      clip++;
      x1 = Math.max(-o.xlim, Math.min(o.xlim, x1));
      x2 = Math.max(-o.xlim, Math.min(o.xlim, x2));
    }
    const d = o.dither ? o.amp * (l1.bit() - l2.bit()) : 0;
    y = x2 * (1 + d) + d + o.noise * rng.n() >= 0 ? 1 : 0;
    D[k] = y; X1[k] = x1; X2[k] = x2; DI[k] = d;
  }
  return { D, X1, X2, DI, clip: clip / n };
}

// ---------- Rx decimation
function cic(D, R = OSR, order = 3) {
  let x = Float64Array.from(D, b => 2 * b - 1);
  for (let o = 0; o < order; o++) for (let i = 1; i < x.length; i++) x[i] += x[i - 1];
  let y = new Float64Array(Math.floor(x.length / R));
  for (let j = 0; j < y.length; j++) y[j] = x[j * R + R - 1];
  for (let o = 0; o < order; o++) for (let j = y.length - 1; j > 0; j--) y[j] -= y[j - 1];
  const g = R ** order;
  for (let j = 0; j < y.length; j++) y[j] /= g;
  return y;
}

const COMP_TAPS = (() => {           // flattens CIC droop up to 0.4 x fs_out (80 kHz)
  const R = OSR, N = 31, M = 15, h = new Float64Array(N), K = 512;
  const G = f => {
    if (f > 0.4) return 0;
    if (f === 0) return 1;
    return 1 / Math.abs(Math.sin(Math.PI * f) / (R * Math.sin(Math.PI * f / R))) ** 3;
  };
  for (let n = 0; n < N; n++) {
    let s = 0;
    for (let k = 0; k <= K; k++) {
      const f = 0.5 * k / K, w = k === 0 || k === K ? 0.5 : 1;
      s += w * G(f) * Math.cos(2 * Math.PI * f * (n - M));
    }
    h[n] = 2 * s * (0.5 / K) * (0.54 - 0.46 * Math.cos(2 * Math.PI * n / (N - 1)));
  }
  const dc = h.reduce((a, b) => a + b, 0);
  return h.map(v => v / dc);
})();

function fir(x, h) {
  const y = new Float64Array(x.length);
  for (let n = 0; n < x.length; n++) {
    let s = 0;
    for (let k = 0; k < h.length && k <= n; k++) s += h[k] * x[n - k];
    y[n] = s;
  }
  return y;
}

// ---------- FFT / spectra
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}

function bhWindow(n) {
  return Float64Array.from({ length: n }, (_, i) => {
    const x = 2 * Math.PI * i / (n - 1);
    return 0.35875 - 0.48829 * Math.cos(x) + 0.14128 * Math.cos(2 * x) - 0.01168 * Math.cos(3 * x);
  });
}

function sndr(y, bin) {
  const n = N_FFT, seg = y.slice(y.length - n), w = bhWindow(n);
  const mean = seg.reduce((a, b) => a + b, 0) / n;
  const re = Float64Array.from(seg, (v, i) => (v - mean) * w[i]), im = new Float64Array(n);
  fft(re, im);
  let sig = 0, tot = 0;
  for (let k = 4; k < n / 2; k++) {
    const p = re[k] ** 2 + im[k] ** 2;
    tot += p;
    if (Math.abs(k - bin) <= 4) sig += p;
  }
  return 10 * Math.log10(sig / Math.max(tot - sig, 1e-30));
}

function psd(x, fs, seg = 8192) {   // averaged, Hann-windowed periodogram
  seg = Math.min(seg, 1 << Math.floor(Math.log2(x.length)));
  const w = Float64Array.from({ length: seg }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (seg - 1)));
  const wp = w.reduce((a, b) => a + b * b, 0);
  const P = new Float64Array(seg / 2);
  let cnt = 0;
  for (let s = 0; s + seg <= x.length; s += seg / 2) {
    let mean = 0;
    for (let i = 0; i < seg; i++) mean += x[s + i];
    mean /= seg;
    const re = Float64Array.from({ length: seg }, (_, i) => (x[s + i] - mean) * w[i]), im = new Float64Array(seg);
    fft(re, im);
    for (let k = 0; k < seg / 2; k++) P[k] += (re[k] ** 2 + im[k] ** 2) / (fs * wp);
    cnt++;
  }
  return { f: Float64Array.from({ length: seg / 2 }, (_, k) => k * fs / seg), p: P.map(v => 10 * Math.log10(v / cnt + 1e-30)) };
}

const packBits = bits => {
  const out = new Uint8Array(Math.ceil(bits.length / 8));
  for (let i = 0; i < bits.length; i++) if (bits[i]) out[i >> 3] |= 128 >> (i & 7);

const unpackBits = (bytes, n) => Uint8Array.from({ length: n }, (_, i) => (bytes[i >> 3] >> (7 - (i & 7))) & 1);
const hashKey = w => unpackBits(sha256(packBits(w)).slice(0, 16), 128);   // 128-bit key

// ---------- binary BCH over GF(2^10), syndrome construction
const GF_N = 1023, EXP = new Int32Array(2 * GF_N), LOG = new Int32Array(GF_N + 1);
(() => { let x = 1; for (let i = 0; i < GF_N; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 1024) x ^= 0x409; } for (let i = GF_N; i < 2 * GF_N; i++) EXP[i] = EXP[i - GF_N]; })();
const gmul = (a, b) => (a && b ? EXP[LOG[a] + LOG[b]] : 0);
const gdiv = (a, b) => (a ? EXP[(LOG[a] - LOG[b] + GF_N) % GF_N] : 0);

function bchSyndrome(bits, t) {      // odd syndromes S1, S3, ... S(2t-1); this is the helper data
  const S = new Int32Array(t);
  for (let i = 0; i < bits.length; i++) if (bits[i]) for (let j = 0; j < t; j++) S[j] ^= EXP[(i * (2 * j + 1)) % GF_N];
  return S;
}
const synToBits = S => { const o = new Uint8Array(S.length * 10); S.forEach((v, j) => { for (let b = 0; b < 10; b++) o[j * 10 + b] = (v >> (9 - b)) & 1; }); return o; };
const bitsToSyn = (bits, t) => Int32Array.from({ length: t }, (_, j) => { let v = 0; for (let b = 0; b < 10; b++) v = (v << 1) | bits[j * 10 + b]; return v; });

function bchDecode(synDiff, t, n) {  // synDiff = syndrome(w_noisy) xor h  ->  error pattern e
  const S = new Int32Array(2 * t + 1);
  for (let i = 1; i <= 2 * t; i++) S[i] = i % 2 ? synDiff[(i - 1) / 2] : gmul(S[i / 2], S[i / 2]);
  const e = new Uint8Array(n);
  if (!S.some(v => v)) return { ok: true, e, L: 0 };
  let C = [1], B = [1], L = 0, m = 1, b = 1;
  for (let k = 0; k < 2 * t; k++) {
    let d = S[k + 1];
    for (let i = 1; i <= L; i++) d ^= gmul(C[i] || 0, S[k + 1 - i]);
    if (!d) { m++; continue; }
    const coef = gdiv(d, b), T = C.slice();
    while (C.length < B.length + m) C.push(0);
    for (let i = 0; i < B.length; i++) C[i + m] ^= gmul(coef, B[i]);
    if (2 * L <= k) { L = k + 1 - L; B = T; b = d; m = 1; } else m++;
  }
  if (L > t) return { ok: false, e, L };
  let roots = 0;
  for (let pos = 0; pos < n; pos++) {
    let v = 0;
    for (let k = 0; k <= L; k++) if (C[k]) v ^= gmul(C[k], EXP[(GF_N - (pos * k) % GF_N) % GF_N]);
    if (!v) { e[pos] = 1; roots++; }
  }
  return roots === L ? { ok: true, e, L } : { ok: false, e: new Uint8Array(n), L };
}

// ---------- SRAM PUF
class SRAMPUF {
  constructor(seed, n = PUF_BITS, sigma25 = 0.06) {
    const r = makeRng(seed);
    this.mismatch = Float64Array.from({ length: n }, () => r.n());   // fixed at fabrication
    this.sigma25 = sigma25;
  }
  sigma(T) { return this.sigma25 * (1 + 0.008 * Math.abs(T - 25)); }
  read(T, rng) {
    const s = this.sigma(T);
    return Uint8Array.from(this.mismatch, m => (m + s * rng.n() > 0 ? 1 : 0));
  }
}

function enroll(puf, t, rng) {
  const w = puf.read(25, rng);
  return { w, h: bchSyndrome(w, t), key: hashKey(w) };
}

function reconstruct(wNoisy, h, t) {
  const sn = bchSyndrome(wNoisy, t);
  const diff = sn.map((v, j) => v ^ h[j]);
  const dec = bchDecode(diff, t, wNoisy.length);
  const w = wNoisy.map((b, i) => b ^ dec.e[i]);
  return { ok: dec.ok, e: dec.e, w, key: hashKey(w), synNoisy: sn };
}

// ---------- attacks
function bm2(s) {                    // Berlekamp-Massey over GF(2)
  const n = s.length, c = new Uint8Array(n + 1);
  let b = new Uint8Array(n + 1), cc = c;
  cc[0] = b[0] = 1;
  let L = 0, m = -1;
  for (let i = 0; i < n; i++) {
    let d = s[i];
    for (let j = 1; j <= L; j++) d ^= cc[j] & s[i - j];
    if (d) {
      const t = cc.slice(), sh = i - m;
      for (let j = 0; j + sh <= n; j++) cc[j + sh] ^= b[j];
      if (2 * L <= i) { L = i + 1 - L; m = i; b = t; }
    }
  }
  return { L, c: cc.slice(0, L + 1) };
}

function lfsrPredict(c, L, known, nOut) {
  const buf = Array.from(known.slice(Math.max(0, known.length - L))), out = new Uint8Array(nOut);
  for (let k = 0; k < nOut; k++) {
    let nb = 0;
    for (let j = 1; j <= L; j++) nb ^= c[j] & buf[buf.length - j];
    buf.push(nb); out[k] = nb;
  }
  return out;
}

function bmAttack(known, future) {
  const { L, c } = bm2(known), g = lfsrPredict(c, L, known, future.length);
  let ok = 0;
  for (let i = 0; i < g.length; i++) ok += g[i] === future[i];
  return { acc: ok / future.length, L, guess: g };
}

function longestRun(D) {
  let best = 0, run = 0, prev = -1;
  for (let i = 0; i < D.length; i++) { run = D[i] === prev ? run + 1 : 1; prev = D[i]; if (run > best) best = run; }
  return best;
}

// ---------- full link
const DEFAULTS = {
  scheme: "proposed", sig: "sine", amp_uA: 0.93, bin: 205, dc_uA: 0.5, force_uA: 10,
  rtia: 321.88e3, buffer: 0.5, dither: true, dither_amp: 0.022, comp_noise: 1e-3, xlim: 2.5,
  dither_seeds: [0x1D2B, 0x7A31], key16: 0xC3A5, chip_id: 0x0B77,
  chip_seed: 7, temp: 37, puf_sigma: 0.06, bch_t: 40, h_tamper: 0,
  ber: 0, lead: 200, rx_wrong_key: false, seed: 2026,
};

function sensorCurrent(P, n) {
  const i = new Float64Array(n), f = P.bin * FS_OUT / N_FFT;
  for (let k = 0; k < n; k++) {
    const t = k / FS;
    if (P.sig === "sine") i[k] = P.amp_uA * 1e-6 * Math.sin(2 * Math.PI * f * t);
    else if (P.sig === "dc") i[k] = P.dc_uA * 1e-6;
    else if (P.sig === "forced") i[k] = P.force_uA * 1e-6;
    else if (P.sig === "zero") i[k] = 0;
  }
  return i;
}

function simulate(P0) {
  const P = { ...DEFAULTS, ...P0 };
  const rng = makeRng(P.seed), n = N_DSM, t = P.bch_t;
  const S = { P, n };

  // Tx analog chain
  S.i_sense = sensorCurrent(P, n);
  S.v_tia = S.i_sense.map(i => tia(i, P.rtia));
  S.u = S.v_tia.map(v => s2d(v, P.buffer));
  const dsm = dsm2(S.u, { dither: P.dither, amp: P.dither_amp, seeds: P.dither_seeds, xlim: P.xlim, noise: P.comp_noise }, rng);
  Object.assign(S, { D: dsm.D, x1: dsm.X1, x2: dsm.X2, dith: dsm.DI, clip: dsm.clip });

  // key + keystream at the Tx
  const rxdb = {};
  if (P.scheme === "baseline") {
    rxdb.key16 = P.key16;
    S.ks_all = new LFSR16(P.key16).bits(ID_BITS + n);
  } else {
    const puf = new SRAMPUF(P.chip_seed, PUF_BITS, P.puf_sigma);
    S.mismatch = puf.mismatch;
    const en = enroll(puf, t, makeRng(P.chip_seed * 7919 + 1));      // at test, once
    S.w_enroll = en.w; S.key_enroll = en.key;
    rxdb.key = en.key; rxdb.h = en.h;
    // Rx sends h at power-up (optionally tampered on the way)
    let hBits = synToBits(en.h);
    S.h_bits = hBits.slice();
    if (P.h_tamper > 0) {
      const r2 = makeRng(P.seed + 99);
      const idx = new Set();
      while (idx.size < Math.min(P.h_tamper, hBits.length)) idx.add(r2.int(hBits.length));
      idx.forEach(i => { hBits[i] ^= 1; });
    }
    S.h_rx_bits = hBits;
    const hRx = bitsToSyn(hBits, t);
    S.w_noisy = puf.read(P.temp, makeRng(P.seed + 17));
    S.e_true = S.w_noisy.map((b, i) => b ^ S.w_enroll[i]);
    const rc = reconstruct(S.w_noisy, hRx, t);
    S.e_hat = rc.e; S.w_fixed = rc.w; S.key_tx = rc.key; S.fe_ok = rc.ok;
    S.syn_noisy_bits = synToBits(rc.synNoisy);
    S.n_err_true = S.e_true.reduce((a, b) => a + b, 0);
    S.n_err_fixed = rc.e.reduce((a, b) => a + b, 0);
    S.key_match = S.key_tx.every((b, i) => b === S.key_enroll[i]);
    S.ber_puf = S.n_err_true / PUF_BITS;
    S.ks_all = new NLFSR128(S.key_tx).bits(ID_BITS + n);
  }
  S.K = S.ks_all.subarray(ID_BITS);
  S.C = S.D.map((d, i) => d ^ S.K[i]);
  const idBits = Uint8Array.from(P.chip_id.toString(2).padStart(ID_BITS, "0"), c => +c);
  S.enc_id = idBits.map((b, i) => b ^ S.ks_all[i]);
  S.frame = new Uint8Array(PREAMBLE.length + SYNC.length + ID_BITS + n);
  S.frame.set(PREAMBLE, 0); S.frame.set(SYNC, 32); S.frame.set(S.enc_id, 48); S.frame.set(S.C, 64);

  // channel
  const rc = makeRng(P.seed + 5);
  S.rx_bits = new Uint8Array(P.lead + S.frame.length);
  for (let i = 0; i < P.lead; i++) S.rx_bits[i] = rc.int(2);
  S.rx_bits.set(S.frame, P.lead);
  let flips = 0;
  if (P.ber > 0) for (let i = 0; i < S.rx_bits.length; i++) if (rc.u() < P.ber) { S.rx_bits[i] ^= 1; flips++; }
  S.channel_flips = flips;

  // Rx
  const hdr = new Uint8Array(48); hdr.set(PREAMBLE); hdr.set(SYNC, 32);
  let pos = -1;
  for (let i = 0; i + 48 <= S.rx_bits.length && pos < 0; i++) {
    let ok = true;
    for (let j = 0; j < 48 && ok; j++) ok = S.rx_bits[i + j] === hdr[j];
    if (ok) pos = i + 48;
  }
  S.sync_pos = pos;
  if (P.scheme === "baseline") {
    S.key_rx16 = P.rx_wrong_key ? P.key16 ^ 1 : rxdb.key16;
    S.ks_rx_all = new LFSR16(S.key_rx16).bits(ID_BITS + n);
  } else {
    S.key_rx = P.rx_wrong_key ? Uint8Array.from({ length: 128 }, () => rng.int(2)) : rxdb.key;
    S.ks_rx_all = new NLFSR128(S.key_rx).bits(ID_BITS + n);
  }
  S.K_rx = S.ks_rx_all.subarray(ID_BITS);

const GLOSS = [
  ["TIA", "Transimpedance amplifier. Turns the sensor's tiny current into a voltage."],
  ["VCM", "Common-mode voltage. The resting middle level of the signal, here 0.6 V."],
  ["DSM", "Delta-sigma modulator. An analog-to-digital converter that outputs a fast stream of single bits."],
  ["Quantization noise", "The small error made every time the modulator rounds its answer to 1 or 0. It makes the bit pattern hard to predict."],
  ["Dither", "A deliberate small random nudge added inside the modulator to break up repeating patterns."],
  ["XOR", "A bit rule: output 1 if the two input bits differ, 0 if they are the same. Doing it twice with the same key undoes it."],
  ["Keystream", "A long sequence of key bits, one per data bit, used to scramble the data."],
  ["LFSR", "Linear feedback shift register. A cheap keystream generator whose rule is linear, so it can be reverse-engineered from a short piece of output."],
  ["NLFSR", "Non-linear feedback shift register. Like an LFSR but with AND terms, which makes reverse-engineering far harder."],
  ["Berlekamp-Massey", "An algorithm that finds the simplest linear rule producing a bit sequence. It breaks any LFSR after seeing twice its length in clean bits."],
  ["PUF", "Physically unclonable function. A chip-unique fingerprint created by random manufacturing differences."],
  ["BCH code", "An error-correcting code. It lets you repair a limited number of flipped bits, up to t."],
  ["Syndrome / helper data", "A short checksum of the fingerprint. It lets the decoder find which bits flipped without revealing the bits themselves."],
  ["Hash", "A one-way scrambler. Same input gives the same output; you cannot work backwards."],
  ["CIC filter", "A cheap averaging filter that turns the fast bitstream into a slower, multi-bit signal."],
  ["SNDR", "Signal-to-noise-and-distortion ratio, in dB. About 60 dB is clean; near 0 dB means the signal is gone."],
  ["Rx / Tx", "Receiver and transmitter."],
];

// Each panel builds its HTML once, then registers draw functions in LIVE.
// The animation loop calls them every frame, so plots scroll with the cursor.
const WN = 500;                                   // analog scope window: 500 DSM clocks = 50 µs
const PAD = { l: 52, r: 14, t: 12, b: 30 };

function panelCanvas(title, cap, h = 200) { return `<div class="panel"><h2>${title}</h2><div class="cap">${cap}</div><canvas data-h="${h}"></canvas><div class="legend"></div></div>`; }
function panelWide(title, cap, inner) {
  if (inner === undefined) { inner = cap; cap = ""; }
  return `<div class="panel wide"><h2>${title}</h2>${cap ? `<div class="cap">${cap}</div>` : ""}${inner}</div>`;
}
function note(html) { return `<div class="panel wide"><div class="explain">${html}</div></div>`; }
function legend(items) { return items.map(([t, c]) => `<span><i class="swatch" style="background:${c}"></i>${t}</span>`).join(""); }
const cvs = () => [...document.querySelectorAll("#panels canvas")];
function setLegend(cv, items) { cv.parentElement.querySelector(".legend").innerHTML = legend(items); }
function head(g, a, x) { g.ctx.save(); g.ctx.strokeStyle = COL.key(); g.ctx.lineWidth = 1.5; g.ctx.beginPath(); g.ctx.moveTo(a.X(x), PAD.t); g.ctx.lineTo(a.X(x), g.h - PAD.b); g.ctx.stroke(); g.ctx.restore(); }
function winArr(arr, s, n, f = v => v) { return Array.from({ length: n }, (_, i) => f(arr[s + i])); }
function reveal(ms = 1400) { return Math.min(1, (performance.now() - panelsT0) / ms); }

// bit row: last n bits ending at the cursor. cmp = ground truth (mismatch shows red). The newest bit is underlined.
function bitsRow(id, arr, n, opt = {}) {
  const el = document.getElementById(id); if (!el) return;
  const k = KC(), s = Math.max(0, k - n + 1); let h = "";
  for (let i = s; i <= k; i++) {
    const bad = opt.cmp && arr[i] !== opt.cmp[i];
    const c = opt.key ? "var(--key)" : opt.cmp ? (bad ? "var(--warn)" : "var(--good)") : opt.ink ? "var(--ink-soft)" : "var(--sig)";
    h += `<b style="color:${c}${i === k ? ";text-decoration:underline" : ""}">${arr[i]}</b>`;
  }
  if (el._h !== h) { el.innerHTML = h; el._h = h; }
}
const rowHTML = (tag, cls, id) => `<div class="bitrow"><span class="tag ${cls}">${tag}</span> <span id="${id}"></span></div>`;

    const [c] = cvs(); setLegend(c, [["TIA (normalised)", COL.sigd()], ["modulator input u", COL.sig()], ["±limit", COL.warn()], ["now", COL.key()]]);
    LIVE.push(() => {
      const s = Math.max(0, KC() - WN + 1), g = dpiCanvas(c, 230), a = axes(g.ctx, g.w, g.h, PAD, [0, WN - 1], [-1.5, 1.5], { xlabel: "last 500 DSM clocks (50 µs)" });
      g.ctx.setLineDash([5, 4]); [1, -1].forEach(v => line(g.ctx, null, [v, v], i => a.X(i * (WN - 1)), a.Y, COL.warn(), 1)); g.ctx.setLineDash([]);
      line(g.ctx, null, winArr(S.v_tia, s, WN, v => (v - VCM) / (VDD / 2)), a.X, a.Y, COL.sigd(), 1.4);

    });
  },

  // ------------------------------------------------------------ DSM
  dsm_out() {
    $("panels").innerHTML = panelCanvas("Inside the modulator", "The two blue lines are the running totals. Healthy: they wiggle near zero. Saturated: they hit the red rails and stay.", 240)

        <tr><td>Fraction of 1s</td><td class="n">${(S.ones * 100).toFixed(1)}%</td><td>${S.sig === "dc" || S.sig === "forced" ? "encodes the DC level" : "about 50% for a centred sine"}</td></tr>
        <tr><td>Longest identical run</td><td class="n">${S.run}</td><td>${pill(S.run < 32, "under 32: BM-safe", "32 or more: exposes keystream")}</td></tr>
        <tr><td>Integrators clipped</td><td class="n">${(S.clip * 100).toFixed(1)}%</td><td>${pill(S.clip < 0.01, "loop in control", "SATURATED")}</td></tr></table>`)
      + note(S.run >= 32 ? `<b style="color:var(--warn)">The modulator is saturated.</b> The output is frozen at one value, so the encrypted stream is just the keystream flipped. This is what lets Berlekamp-Massey recover an LFSR.` : `The longest run is only <b>${S.run}</b> bits, so the output keeps toggling and the keystream stays hidden.`);
    const [c1, c2] = cvs(); const W = 300;
    setLegend(c1, [["integrator 1", COL.sigd()], ["integrator 2", COL.sig()], ["input u", COL.faint()], ["±rail", COL.warn()], ["D = 1", COL.key()]]); setLegend(c2, [["modulator output D", COL.sig()]]);
    LIVE.push(() => {
      const s = Math.max(0, KC() - W + 1), rail = state.xlim;
      let g = dpiCanvas(c1, 240), a = axes(g.ctx, g.w, g.h, PAD, [0, W - 1], [-rail * 1.1, rail * 1.1], { xlabel: "last 300 DSM clocks (30 µs)" });
      g.ctx.setLineDash([5, 4]); [rail, -rail].forEach(v => line(g.ctx, null, [v, v], i => a.X(i * (W - 1)), a.Y, COL.warn(), 1)); g.ctx.setLineDash([]);
      line(g.ctx, null, winArr(S.u, s, W), a.X, a.Y, COL.faint(), 1);
      line(g.ctx, null, winArr(S.x1, s, W), a.X, a.Y, COL.sigd(), 1.3); line(g.ctx, null, winArr(S.x2, s, W), a.X, a.Y, COL.sig(), 1.8);
      g.ctx.fillStyle = COL.key(); for (let i = 0; i < W; i++) if (S.D[s + i]) g.ctx.fillRect(a.X(i), g.h - 27, Math.max(1, a.X(1) - a.X(0)), 4);
      head(g, a, W - 1);
      g = dpiCanvas(c2, 150); a = axes(g.ctx, g.w, g.h, PAD, [0, 96], [-0.15, 1.15], { ny: 1, yfmt: v => v < 0.5 ? "0" : "1", xlabel: "last 96 bits" });
      stepDigital(g.ctx, S.D, Math.max(0, KC() - 95), 96, a.X, a.Y, COL.sig()); head(g, a, 96);
    });
  },

  // ------------------------------------------------------------ XOR
  xor_out() {
    $("panels").innerHTML = panelWide("Encryption, bit by bit", `Last 40 bits, sliding left. In every column, C differs from D exactly where K is 1.
        ${rowHTML("D&nbsp;", "data", "rD")}${rowHTML("K&nbsp;", "key", "rK")}${rowHTML("C&nbsp;", "data", "rC")}`)
      + panelCanvas("Spectrum: encrypted vs original", "Whole run. The XOR spreads the noise-shaped signal into a flat, noise-like spectrum on the wire.", 230);
    const c = cvs()[0], g = dpiCanvas(c, 230);
    const specC = psd(Float64Array.from(S.C, b => 2 * b - 1), FS, 4096), specD = psd(Float64Array.from(S.D, b => 2 * b - 1), FS, 4096);
    const a = axes(g.ctx, g.w, g.h, { l: 46, r: 12, t: 12, b: 34 }, [Math.log10(2e3), Math.log10(FS / 2)], [-120, -40], { yfmt: v => v.toFixed(0), xlabel: "frequency (Hz, log scale)", xticks: [[4, "10k"], [5, "100k"], [6, "1M"]] });
    const plotSpec = (sp, col, wd) => { const xs = [], ys = []; for (let k = 1; k < sp.f.length; k++) { xs.push(Math.log10(sp.f[k])); ys.push(sp.p[k]); } line(g.ctx, xs, ys, a.X, a.Y, col, wd); };
    plotSpec(specC, COL.key(), 1.2); plotSpec(specD, COL.sig(), 1.6);
    setLegend(c, [["encrypted C (on the wire)", COL.key()], ["decrypted D (at Rx)", COL.sig()]]);
    LIVE.push(() => { bitsRow("rD", S.D, 40); bitsRow("rK", S.K, 40, { key: true }); bitsRow("rC", S.C, 40, { ink: true }); });
  },

  // ------------------------------------------------------------ frame
  frame() {
    $("panels").innerHTML = panelWide("Transmitted frame", `<div class="bitrow">
        <span class="tag data">preamble</span> ${fmtBits(PREAMBLE, 0, 32)}<br>
        <span class="tag data">sync</span> ${fmtBits(SYNC, 0, 16)}<br>
        <span class="tag key">enc ID</span> ${fmtBits(S.enc_id, 0, 16)} <span style="color:var(--ink-faint)">(ID 0x${state.chip_id.toString(16).toUpperCase()} XOR first 16 key bits)</span><br>
        <span class="tag data">payload</span> <span id="rP"></span></div>
        <p class="cap" style="margin-top:10px">The header is sent once; the payload row shows the encrypted bits streaming out right now.</p>`)
      + note(state.scheme === "proposed" ? `A wrong PUF key or tampered helper data gives a garbled ID, so the Rx rejects the link.` : `With a static key this ID is only an alignment aid, as Alperen said, not full authentication.`);
    LIVE.push(() => bitsRow("rP", S.C, 48, { ink: true }));
  },

  // ------------------------------------------------------------ channel
  channel() {
    const p = Math.max(0, S.sync_pos - 20);
    $("panels").innerHTML = panelWide("On the wire: what an eavesdropper sees", `Header (idle bits, then the sync pattern in blue):
        <div class="bitrow">${Array.from({ length: 80 }, (_, i) => { const idx = p + i, hl = S.sync_pos >= 0 && idx >= S.sync_pos - 48 && idx < S.sync_pos; return `<b style="color:${hl ? "var(--sig)" : "var(--ink-soft)"}">${S.rx_bits[idx]}</b>`; }).join("")}</div>
        <p class="cap" style="margin:10px 0 4px">Payload streaming past right now (red = flipped by the channel):</p>
        <div class="bitrow"><span id="rW"></span></div>
        <p class="cap" style="margin-top:8px">Sync found at position <b>${S.sync_pos}</b>. Channel flipped <b>${S.channel_flips}</b> bits (BER ${(state.ber * 100).toFixed(2)}%).</p>`)
      + note(`The eavesdropper sees exactly these bits and knows the whole design, but not the key. The payload looks like coin flips.`);
    LIVE.push(() => {
      const el = $("rW"), k = KC(), s = Math.max(0, k - 63), base = S.sync_pos >= 0 ? S.sync_pos + 16 : 0; let h = "";
      for (let i = s; i <= k; i++) { const bad = S.C_rx[i] !== S.C[i]; h += `<b style="color:${bad ? "var(--warn)" : "var(--ink-soft)"}${i === k ? ";text-decoration:underline" : ""}">${S.C_rx[i]}</b>`; }
      if (el._h !== h) { el.innerHTML = h; el._h = h; }
    });
  },

  // ------------------------------------------------------------ Rx decrypt
  rx_dec() {
    $("panels").innerHTML = panelWide("Decryption at the receiver", `Last 40 bits. In D_rx, green = matches what the transmitter sent, red = wrong.
        ${rowHTML("C&nbsp;&nbsp;", "data", "rC")}${rowHTML("K_rx", "key", "rK")}${rowHTML("D_rx", "data", "rD")}
        <p class="cap" style="margin-top:10px">${state.rx_wrong_key ? `<b style="color:var(--warn)">Wrong key:</b> about half the bits come out red.` : `Correct key: every bit is green.`} Bit errors over the whole run: <b>${(S.rx_bit_err * 100).toFixed(1)}%</b>.</p>`)
      + note(`Same key, reversed: <code>D = C ⊕ K</code>. A wrong key gives garbage, not a slightly-wrong answer, which is why the ID check doubles as a key check.`);
    LIVE.push(() => { bitsRow("rC", S.C_rx, 40, { ink: true }); bitsRow("rK", S.K_rx, 40, { key: true }); bitsRow("rD", S.D_rx, 40, { cmp: S.D }); });
  },

  // ------------------------------------------------------------ Rx output
  rx_out() {
    $("panels").innerHTML = panelCanvas("Recovered output", state.rx_wrong_key ? "With the wrong key the decimated output is noise." : "The filters average the bits back into the waveform. Pale line = what the modulator was given.", 230)
      + panelCanvas("Spectrum of the recovered signal", "Whole run. A tall spike means the signal came through.", 230)
      + panelWide("Link quality", `<table class="mini"><tr><th>Metric</th><th>Value</th></tr>
        <tr><td>Rx ID check</td><td>${pill(S.id_ok, "PASS", "FAIL")}</td></tr>
        <tr><td>SNDR</td><td class="n">${S.sndr != null ? S.sndr.toFixed(1) + " dB" : "n/a (not a sine)"}</td></tr>
        <tr><td>Bit errors vs Tx</td><td class="n">${(S.rx_bit_err * 100).toFixed(2)}%</td></tr></table>`);
    const [c1, c2] = cvs(), bad = state.rx_wrong_key, NS = 120;
    setLegend(c1, bad ? [["recovered (noise)", COL.warn()], ["now", COL.key()]] : [["modulator input (reference)", COL.sigd()], ["recovered output", COL.sig()], ["now", COL.key()]]);
    const g2 = dpiCanvas(c2, 230), sp = psd(Float64Array.from(S.y.slice(-2048)), FS_OUT, 1024);
    const a2 = axes(g2.ctx, g2.w, g2.h, { l: 46, r: 12, t: 12, b: 34 }, [0, 100], [-120, 0], { yfmt: v => v.toFixed(0), xlabel: "frequency (kHz)" });
    { const xs = [], ys = []; for (let k = 1; k < sp.f.length; k++) { xs.push(sp.f[k] / 1e3); ys.push(sp.p[k]); } line(g2.ctx, xs, ys, a2.X, a2.Y, bad ? COL.warn() : COL.sig(), 1.4); }
    setLegend(c2, [["recovered spectrum", bad ? COL.warn() : COL.sig()]]);
    LIVE.push(() => {
      const j = Math.min(S.y.length - 1, Math.floor(KC() / OSR)), s = Math.max(0, j - NS + 1);
      const seg = winArr(S.y, s, NS), mx = Math.max(0.06, ...seg.map(Math.abs)) * 1.25, g = dpiCanvas(c1, 230);
      const a = axes(g.ctx, g.w, g.h, PAD, [0, NS - 1], [-mx, mx], { xlabel: "last 120 output samples (200 kS/s)" });
      if (!bad && state.sig === "sine") line(g.ctx, null, winArr(S.u_ref, s, NS), a.X, a.Y, COL.sigd(), 1.3);
      line(g.ctx, null, seg, a.X, a.Y, bad ? COL.warn() : COL.sig(), 1.9); head(g, a, NS - 1);
    });
  },

  // ------------------------------------------------------------ PUF
  puf() {
    if (state.scheme !== "proposed") return;
    $("panels").innerHTML = panelCanvas("SRAM power-up fingerprint", "Cells settle one by one at power-up. Blue = same as at enrollment, red = flipped this time.", 200)
      + panelWide("This power-up vs enrollment", `<table class="mini"><tr><th>Metric</th><th>Value</th><th></th></tr>
        <tr><td>PUF bits</td><td class="n">${PUF_BITS}</td><td></td></tr>
        <tr><td>Flipped since enrollment</td><td class="n">${S.n_err_true}</td><td>${(S.ber_puf * 100).toFixed(1)}% at ${state.temp}°C</td></tr>
        <tr><td>Different chip</td><td class="n">about 50%</td><td>a different chip gives a different key</td></tr></table>`)
      + note(`Raise the temperature or the PUF noise slider and more cells turn red. That is why error correction comes next.`);
    const [c] = cvs(); setLegend(c, [["stable bit", COL.sig()], ["flipped this power-up", COL.warn()]]);
    LIVE.push(() => {
      const show = 120, p = reveal(1600), g = dpiCanvas(c, 200), a = axes(g.ctx, g.w, g.h, { l: 30, r: 12, t: 10, b: 24 }, [0, show], [-0.1, 1.1], { ny: 1, yfmt: v => v < .5 ? "0" : "1", xlabel: "PUF cell index (first 120)" });
      const cw = a.X(1) - a.X(0), n = Math.floor(show * p);
      for (let i = 0; i < n; i++) { g.ctx.fillStyle = S.e_true[i] ? COL.warn() : COL.sig(); const y = a.Y(S.w_noisy[i]); g.ctx.fillRect(a.X(i) + cw * 0.15, Math.min(y, a.Y(0)), Math.max(1.5, cw * 0.7), Math.abs(y - a.Y(0)) + 3); }
      if (p < 1) ANIM.dirty = true;
    });
  },

  // ------------------------------------------------------------ fuzzy extractor
  fe() {
    if (state.scheme !== "proposed") return;
    const ok = S.n_err_true <= state.bch_t && state.h_tamper === 0;
    $("panels").innerHTML = panelCanvas("Error-correction headroom", "PUF errors this power-up against what the BCH code can fix. Left of the dashed line the key is exact.", 210)
      + panelWide("Reconstruction result", `<table class="mini"><tr><th>Step</th><th>Value</th><th></th></tr>
        <tr><td>Errors to correct</td><td class="n">${S.n_err_true}</td><td></td></tr>
        <tr><td>BCH capacity t</td><td class="n">${state.bch_t}</td><td>${pill(S.n_err_true <= state.bch_t, "within capacity", "too many errors")}</td></tr>
        <tr><td>Helper data tampered</td><td class="n">${state.h_tamper} bits</td><td>${state.h_tamper === 0 ? "clean" : pill(false, "", "corrupts the target")}</td></tr>
        <tr><td>Decoder succeeded</td><td>${pill(S.fe_ok, "yes", "no")}</td><td></td></tr>
        <tr><td>Key matches enrollment</td><td>${pill(S.key_match, "MATCH", "MISMATCH")}</td><td>${S.key_match ? "link works" : "Rx ID check will fail"}</td></tr></table>`)
      + note(ok ? `${S.n_err_true} errors, within t = ${state.bch_t}: the key is recovered exactly.` : S.n_err_true > state.bch_t ? `<b style="color:var(--warn)">Too many errors</b> (${S.n_err_true} against t = ${state.bch_t}). The decoder cannot fix them, the key is wrong, and the Rx ID check fails.` : `<b style="color:var(--warn)">Helper data was tampered.</b> Even one flipped bit shifts the decoder's target, so the key comes out wrong and the Rx catches it.`);
    const [c] = cvs(); setLegend(c, [["key correct", COL.sig()], ["this power-up", S.n_err_true <= state.bch_t ? COL.good() : COL.warn()]]);
    LIVE.push(() => {
      const p = reveal(1300), g = dpiCanvas(c, 210), a = axes(g.ctx, g.w, g.h, { l: 62, r: 12, t: 16, b: 30 }, [0, 70], [-0.1, 1.1], { ny: 1, yfmt: v => v < 0.5 ? "key wrong" : "key exact", xlabel: "flipped PUF bits" });
      line(g.ctx, [0, state.bch_t, state.bch_t, 70], [1, 1, 0, 0], a.X, a.Y, COL.sig(), 2);
      g.ctx.strokeStyle = COL.faint(); g.ctx.setLineDash([4, 4]); g.ctx.beginPath(); g.ctx.moveTo(a.X(state.bch_t), 16); g.ctx.lineTo(a.X(state.bch_t), g.h - 30); g.ctx.stroke(); g.ctx.setLineDash([]);
      g.ctx.fillStyle = COL.faint(); g.ctx.textAlign = "center"; g.ctx.fillText("t = " + state.bch_t, a.X(state.bch_t), 10);
      const good = S.n_err_true <= state.bch_t, x = S.n_err_true * p, y = good ? 1 : 0;
      g.ctx.fillStyle = good ? COL.good() : COL.warn(); g.ctx.beginPath(); g.ctx.arc(a.X(x), a.Y(y), 5.5, 0, 7); g.ctx.fill();
      if (p < 1) ANIM.dirty = true;
    });
  },

  keyd() { keystreamPanel(); }, psk() { keystreamPanel(); }, lfsr() { keystreamPanel(); }, nlfsr() { keystreamPanel(); },

  // ------------------------------------------------------------ Rx side key
  rx_key() {
    const prop = state.scheme === "proposed", txk = prop ? bitsHex(S.key_tx) : "0x" + (state.key16 & 0xFFFF).toString(16).toUpperCase(),
      rxk = prop ? bitsHex(S.key_rx) : "0x" + (S.key_rx16 & 0xFFFF).toString(16).toUpperCase(), same = txk === rxk;
    $("panels").innerHTML = panelWide("Key at the transmitter vs key at the receiver", `<table class="mini"><tr><th>Side</th><th>Key</th></tr>
        <tr><td>Transmitter${prop ? " (just regenerated from the PUF)" : ""}</td><td class="n" style="text-align:left;word-break:break-all">${txk}</td></tr>
        <tr><td>Receiver${prop ? " (stored at enrollment)" : ""}</td><td class="n" style="text-align:left;word-break:break-all">${rxk}</td></tr>
        <tr><td>Match</td><td>${pill(same, "identical: decryption works", "DIFFERENT: decryption fails")}</td></tr></table>`)
      + note(prop ? `The receiver's database holds each chip's key and its public helper data h. It sends h at power-up and keeps the key secret.` : `Both sides hold the same fixed key, programmed in advance.`);
  },
  rx_ks() {
    let bad = 0; for (let i = 0; i < S.n; i++) bad += S.K[i] !== S.K_rx[i];
    $("panels").innerHTML = panelWide("Keystream: transmitter vs receiver", `Last 48 bits, sliding left. Green = the two sides agree, red = they differ.
        ${rowHTML("K_tx", "key", "rT")}${rowHTML("K_rx", "key", "rR")}
        <p class="cap" style="margin-top:10px">Over the whole run the two keystreams differ in <b>${(bad / S.n * 100).toFixed(1)}%</b> of bits.</p>`)
      + note(bad === 0 ? `Identical keys give identical keystreams, so the receiver undoes the XOR exactly.` : `Different keys give keystreams that disagree on about half the bits, so decryption produces noise.`);
    LIVE.push(() => { bitsRow("rT", S.K, 48, { key: true }); bitsRow("rR", S.K_rx, 48, { cmp: S.K }); });
  },

  // ------------------------------------------------------------ everything on one time axis
  scope() {
    const ROWS = 9, RH = 42, H = ROWS * RH + 34, W = 250;
    $("panels").innerHTML = panelCanvas("Every signal at the same instant", "One time axis, scrolling left. Read down a column to follow a single moment through the whole chain. The red line is 'now'.", H).replace('class="panel"', 'class="panel wide"');
    const [c] = cvs(), pk = Math.max(1e-9, peakAbs(S.i_sense));
    LIVE.push(() => {
      const k = KC(), s = Math.max(0, k - W + 1), g = dpiCanvas(c, H), ctx = g.ctx, L = 118, R = 12;
      ctx.clearRect(0, 0, g.w, g.h); const X = i => L + i / (W - 1) * (g.w - L - R);
      const rows = [
        ["sensor current", "a", i => S.i_sense[i] / pk, COL.sig()], ["TIA voltage", "a", i => (S.v_tia[i] - VCM) / 0.6, COL.sig()],
        ["modulator input u", "a", i => S.u[i] / 1.3, COL.sig()], ["integrator 2", "a", i => S.x2[i] / state.xlim, COL.sig()],
        ["D  modulator bits", "d", i => S.D[i], COL.sig()], ["K  keystream", "d", i => S.K[i], COL.key()],
        ["C  on the wire", "d", i => S.C[i], COL.ink()], ["D_rx  recovered", "d", i => S.D_rx[i], COL.sig()],
        ["y  final output", "a", i => S.y[Math.min(S.y.length - 1, Math.floor(i / OSR))] / 0.3, COL.sig()],
      ];
      ctx.font = "11px " + CSS("--sans"); rows.forEach(([name, kind, f, col], r) => {
        const top = 6 + r * RH, mid = top + RH / 2 - 2;
        ctx.strokeStyle = COL.grid(); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, top + RH - 3); ctx.lineTo(g.w - R, top + RH - 3); ctx.stroke();
        ctx.fillStyle = COL.ink(); ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(name, L - 8, mid);
        ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.beginPath();
        for (let i = 0; i < W; i++) {
          const v = f(s + i), y = kind === "a" ? mid - Math.max(-1.2, Math.min(1.2, v)) * (RH / 2 - 7) : (v ? top + 8 : top + RH - 11);
          if (kind === "d") { if (i === 0) ctx.moveTo(X(i), y); else { ctx.lineTo(X(i), kind === "d" ? (f(s + i - 1) ? top + 8 : top + RH - 11) : y); ctx.lineTo(X(i), y); } ctx.lineTo(X(i + 1), y); }
          else i ? ctx.lineTo(X(i), y) : ctx.moveTo(X(i), y);
        }
        ctx.stroke();
      });
      ctx.strokeStyle = COL.key(); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X(W - 1), 2); ctx.lineTo(X(W - 1), H - 30); ctx.stroke();
      ctx.fillStyle = COL.ink(); ctx.textAlign = "center"; ctx.fillText("last 250 DSM clocks (25 µs)", (L + g.w - R) / 2, H - 10);
    });
  },
};

      <tr><td>Known ID leak</td><td class="n">16</td><td class="n">${idl.L}</td><td class="n">${(idl.acc * 100).toFixed(0)}%</td><td>${pill(idl.acc < 0.9, "safe", "broken")}</td></tr>
      <tr><td>Probe / tamper</td><td class="n">64</td><td class="n">${probe.L}</td><td class="n">${(probe.acc * 100).toFixed(0)}%</td><td>${pill(probe.acc < 0.9, "safe", "broken")}</td></tr>
      ${S.sig === "forced" ? `<tr><td>Forced input (saturation)</td><td class="n">64, many tries</td><td class="n">n/a</td><td class="n">${(S.eve_forced_best * 100).toFixed(0)}%</td><td>${pill(S.eve_forced_broken < 0.5, "safe", "broken")}</td></tr>` : ""}</table>`)
    + panelCanvas("Attacker's predictions against the real keystream", "The attacker's guesses appear one by one. Green = correct, red = wrong. All green means the key stream is broken.", 160)
    + note(prop ? `With 64 probed bits the attacker predicts about <b>${(probe.acc * 100).toFixed(0)}%</b> of the NLFSR's future bits: guessing. The same probe breaks the LFSR completely.` : `With 64 probed bits the attacker predicts <b>${(probe.acc * 100).toFixed(0)}%</b> of the LFSR's future bits. The known ID alone gives only 16 bits, which is not enough.`);
  const [c] = cvs(); setLegend(c, [["correct prediction", COL.good()], ["wrong prediction", COL.warn()]]);
  let match, startX;
  if (S.sig === "forced") { match = S.eve_match; startX = S.eve_window[1]; }
  else { match = new Uint8Array(N_DSM); const known = S.K.subarray(0, 64), { L, c: cc } = bm2(known), g2 = lfsrPredict(cc, L, known, 400); for (let i = 0; i < 400; i++) match[64 + i] = g2[i] === S.K[64 + i] ? 1 : 0; startX = 64; }
  LIVE.push(() => {
    const show = 300, p = reveal(2200), g = dpiCanvas(c, 160), a = axes(g.ctx, g.w, g.h, { l: 30, r: 12, t: 10, b: 26 }, [0, show], [-0.1, 1.1], { ny: 1, yfmt: v => v < .5 ? "✗" : "✓", xlabel: "keystream bit index" });
    const cw = a.X(1) - a.X(0), n = Math.floor(show * p);
    for (let i = 0; i < n; i++) { const idx = startX + i; if (idx >= match.length) break; g.ctx.fillStyle = match[idx] ? COL.good() : COL.warn(); g.ctx.fillRect(a.X(i), a.Y(match[idx]) - 3, Math.max(1.5, cw), 6); }
    if (p < 1) ANIM.dirty = true;
  });
}

function renderPanels() {
  LIVE.length = 0; panelsT0 = performance.now();
  renderInfo();
  const fn = PANELS[selected];
  if (fn) fn(); else $("panels").innerHTML = note("Select a block above to probe it.");
  ANIM.dirty = true;
}

$("foot").innerHTML =
  `<b>About this model.</b> Everything runs live in your browser: a behavioural port of the Python model. The DSM is a discrete-time model of the continuous-time loop. TIA clipping, the ×0.5 buffer, the LFSR polynomial, the NLFSR taps (from Grain-128), integrator rails and PUF noise are illustrative, not measured silicon values. SHA-256 stands in for a lightweight on-chip hash. The BCH code is real (GF(2¹⁰), syndrome construction). Numbers show mechanisms and trends, not exact chip performance. The animation slows the 10 MHz bitstream by a large factor so the flow can be followed. Baseline = the ESSERC'25 S-DSM; Proposed = SRAM-PUF + fuzzy extractor + NLFSR.`;

// glossary
(function () {
  const d = document.createElement("details"); d.className = "gloss";
  d.innerHTML = "<summary>Glossary: every term used here, in plain words</summary><dl>" + GLOSS.map(([t, x]) => "<dt>" + t + "</dt><dd>" + x + "</dd>").join("") + "</dl>";
  document.querySelector(".wrap").insertBefore(d, $("foot"));
})();

// boot
buildScenarios(); wireTransport(); setHH(); addEventListener("resize", setHH);
if (window.ResizeObserver) new ResizeObserver(() => { ANIM.dirty = true; }).observe($("dockInner"));
setScheme("proposed"); advance(0); markSelected(); renderPanels();
requestAnimationFrame(frame);
$("themeBtn").addEventListener("click", () => {
  const r = document.documentElement, n = r.getAttribute("data-theme") === "dark" ? "light" : "dark";
  r.setAttribute("data-theme", n); try { localStorage.setItem("theme", n); } catch (e) {}
  renderPanels();
});
if (document.fonts) document.fonts.ready.then(() => { setHH(); renderPanels(); });
// ===== PANELS-END =====
</script>
