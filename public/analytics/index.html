<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Analytics - nithinpuru</title>
<link rel="canonical" href="https://nithinpuru.com/analytics/">
<script>
// The dashboard moved to nithinpuru.com/analytics/. Forward there, keeping the query
// and #fragment (?key=… becomes ?owner=…, which the geo rule there lets through).
// Signing in there hops through here once (?optout=1) so this browser stops being
// counted on the tools too; its opt-out switch sends ?optout=0 / 1 the same way.
// Either hop marks the browser as the owner's (np_owner), which the region gate
// (scripts/region-gate.mjs) lets through even while it is being counted.
(function () {
  var q = new URLSearchParams(location.search);
  try {
    if (q.has("optout")) localStorage.setItem("np_owner", "1");
    if (q.get("optout") === "1") localStorage.setItem("np_notrack", "1");
    if (q.get("optout") === "0") localStorage.removeItem("np_notrack");
  } catch (e) {}
  q.delete("optout");
  if (q.has("key")) { q.set("owner", q.get("key")); q.delete("key"); }
  var s = q.toString();
  location.replace("https://nithinpuru.com/analytics/" + (s ? "?" + s : "") + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0; url=https://nithinpuru.com/analytics/">
</head>
<body>
<p>The analytics dashboard moved to <a href="https://nithinpuru.com/analytics/">nithinpuru.com/analytics</a>.</p>
</body>
</html>
