# Conference series tracked by the bot.
#
# One entry per RECURRING conference (not per year). The tracker creates the
# next year's edition automatically once the current one is over.
#
# Fields
#   id           short unique id, lowercase, used in edition ids (e.g. iscas-2027)
#   name         display name without year
#   full         full conference name
#   org          organizing society
#   category     t1 | ssc | casf | cas | eda | pwr   (see README)
#   focus        one-line topic summary
#   url          main/official website (always checked)
#   edition_url  optional per-year site, {year} is replaced (e.g. https://{year}.ieee-iscas.org/)
#   extra_urls   optional list of extra official pages to check, {year} allowed
#   typical      optional hint shown while a deadline is not announced
#
# Shared sources are listing pages that cover many conferences. The tracker
# reads them once per run and only keeps the text around each conference name.
shared_sources:
  - url: https://ieee-cas.org/conference-events/full-conference-list
    official: true
    applies_to: [casf, cas, t1]
  - url: https://ieee-cas.org/conference-events/full-conference-list?page=1
    official: true
    applies_to: [casf, cas, t1]
  - url: https://mtt.org/mtt-s-sponsored-conferences/
    official: true
    applies_to: [ssc]
  - url: https://www.cse.chalmers.se/research/group/vlsi/conference/
    official: false          # community-maintained table, used as a hint only
    applies_to: [t1, ssc, casf, cas, eda]

series:
  # ---------- Top tier ----------
  - id: isscc
    name: ISSCC
    full: International Solid-State Circuits Conference
    org: IEEE SSCS
    category: t1
    focus: All IC design (analog, RF, digital, memory, power)
    url: https://www.isscc.org/
    extra_urls: ["https://www.isscc.org/future-conferences"]
    typical: Paper deadline usually early September

  - id: vlsi
    name: VLSI Symposium
    full: Symposium on VLSI Technology and Circuits
    org: IEEE / JSAP
    category: t1
    focus: Circuits and process technology
    url: https://www.vlsisymposium.org/
    typical: Paper deadline usually late January

  - id: cicc
    name: CICC
    full: Custom Integrated Circuits Conference
    org: IEEE SSCS
    category: t1
    focus: Analog, mixed-signal, RF and digital ICs
    url: https://www.ieee-cicc.org/
    extra_urls: ["https://www.ieee-cicc.org/{year}-cicc-author-submission-guidelines/"]
    typical: Paper deadline usually mid-November

  # ---------- Other SSCS / RF ----------
  - id: esserc
    name: ESSERC
    full: European Solid-State Electronics Research Conference
    org: IEEE SSCS / EDS
    category: ssc
    focus: Circuits and devices (formerly ESSCIRC/ESSDERC)
    url: https://www.esserc.org/
    edition_url: https://www.esserc{year}.org/
    typical: Paper deadline usually early April

  - id: asscc
    name: A-SSCC
    full: Asian Solid-State Circuits Conference
    org: IEEE SSCS
    category: ssc
    focus: All IC design
    url: https://www.asscc.org/
    edition_url: https://a-sscc{year}.org/
    typical: Paper deadline usually early June

  - id: rfic
    name: RFIC
    full: Radio Frequency Integrated Circuits Symposium
    org: IEEE MTT-S
    category: ssc
    focus: RF, mm-wave and THz ICs
    url: https://rfic-ieee.org/
    typical: Paper deadline usually early January

  - id: ims
    name: IMS
    full: International Microwave Symposium
    org: IEEE MTT-S
    category: ssc
    focus: "RF, microwave, mm-wave and THz circuits and systems (co-located with RFIC)"
    url: "https://ims-ieee.org/"
    typical: Paper deadline usually early December

  - id: bcicts
    name: BCICTS
    full: BiCMOS and Compound Semiconductor Integrated Circuits and Technology Symposium
    org: IEEE EDS / MTT-S
    category: ssc
    focus: SiGe BiCMOS and III-V circuits and devices
    url: "https://bcicts.org/"
    typical: Paper deadline usually May

  - id: rfit
    name: RFIT
    full: International Symposium on Radio-Frequency Integration Technology
    org: IEEE MTT-S
    category: ssc
    focus: "RF, mm-wave and THz ICs and integration (Asia-Pacific)"
    url: "https://rfit2026.org/"
    edition_url: "https://rfit{year}.org/"
    typical: Paper deadline usually March to May

  - id: eumic
    name: EuMIC
    full: European Microwave Integrated Circuits Conference (European Microwave Week)
    org: EuMA
    category: ssc
    focus: Microwave and mm-wave ICs and semiconductor technology
    url: "https://www.eumw.eu/"
    typical: Paper deadline usually late March to April

  # ---------- CAS flagships ----------
  - id: iscas
    name: ISCAS
    full: International Symposium on Circuits and Systems
    org: IEEE CASS
    category: casf
    focus: Broad circuits and systems (CAS global flagship)
    url: https://ieee-cas.org/
    edition_url: https://{year}.ieee-iscas.org/
    extra_urls: ["https://{year}.ieee-iscas.org/call-for-papers", "https://epapers2.org/iscas{year}/ESR/login.php"]
    typical: Paper deadline usually mid-October

  - id: biocas
    name: BioCAS
    full: Biomedical Circuits and Systems Conference
    org: IEEE CASS
    category: casf
    focus: Biomedical circuits, neural interfaces, sensors
    url: https://ieee-cas.org/
    typical: Paper deadline usually June

  - id: aicas
