name: Research Radar data

# Fetches every Research Radar source server-side (arXiv, HF Daily Papers,
# IEEE / finance journals via Crossref, Semantic Scholar, RSS feeds) and
# commits one snapshot per domain to public/research-radar/data/. The page
# loads these instantly instead of fetching through public CORS proxies.

on:
  schedule:
    - cron: "41 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-radar-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research-radar/requirements.txt
      - run: pip install -r research-radar/requirements.txt
      - name: Fetch sources
        run: python research-radar/fetch.py
      - name: Commit snapshots
        run: |
          git config user.name "research-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research-radar/data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Research Radar data $(date -u +%F\ %H:%M)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5)); git pull --rebase
          done
          exit 1
