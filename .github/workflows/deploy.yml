name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Research Radar refresh (was research-radar-data.yml). Its snapshots are
  # never committed - they're rewritten wholesale each run and would grow the
  # repo by ~1 GB a year - so this build fetches them and they live only in
  # the deployed site. Other deploys copy the live snapshots back in.
  # Quant Terminal web edition (/quant-terminal/app/, see below): republished every
  # 15 minutes on weekdays 07:00-24:00 UTC (Europe, then the US pre-market, session and
  # after-hours) and every 30 minutes overnight (Asian markets); the 3-hourly run above
  # covers weekends. These two schedules only refresh data: no radar refetch, no smoke test.
  schedule:
    - cron: "41 */3 * * *"
    - cron: "7,22,37,52 7-23 * * 1-5"
    - cron: "7,37 0-6 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_radar:
        description: "Refetch Research Radar sources"
        type: boolean
        default: false
  # Commits pushed by the tracker workflows use GITHUB_TOKEN, which does not
  # trigger other workflows - redeploy explicitly once they finish.
  workflow_run:
    workflows: ["Track conferences", "Resolve review", "Update quant terminal data", "FX Quant data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # no pip cache: pip only runs on radar refreshes, and on other deploys the
          # missing cache folder fails the job in the post-step cache save

      - name: Research Radar snapshots
        timeout-minutes: 30
        env:
          REFRESH: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 */3 * * *') || inputs.refresh_radar == true }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_EXPLAINERS: ${{ vars.RADAR_EXPLAINERS }}   # "1" enables precomputed explainers
        run: |
          # Copy the deployed snapshots; refetch on schedule, or if the copy failed.
          if [ "$REFRESH" = true ] || ! python research-radar/fetch.py --seed-only; then
            pip install -r research-radar/requirements.txt
            python research-radar/fetch.py --seed
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://nithinpuru.github.io
          ASTRO_BASE: /
          # Read-only token for the build-time GitHub stars lookup (src/lib/github.ts).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Quant Terminal web edition: the dashboard of career-semi-quant's local edition,
      # published as static files (UI + data/*.json) by `semiquant publish`. Its refresh
      # tiers (live every run, hourly, 3-hourly, daily) plus this cache keep a 15-minute
      # schedule light. Never committed (like the radar snapshots); a failed run keeps the
      # previous output, and it never blocks the rest of the site.
      - name: Quant terminal cache keys
        id: qt
        run: |
          echo "hour=qt-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
          echo "week=qt-pip-$(date -u +%G%V)" >> "$GITHUB_OUTPUT"
      - name: Restore quant terminal data
        uses: actions/cache@v4
        with:
          path: |
            ~/.semiquant/cache
            .qt-out
          key: ${{ steps.qt.outputs.hour }}
          restore-keys: qt-2
      - name: Restore pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ steps.qt.outputs.week }}
          restore-keys: qt-pip-
      - name: Quant terminal web edition
        timeout-minutes: 25
        continue-on-error: true
        run: |
          python -m pip install --quiet "semiquant @ git+https://github.com/chennakeshavadasa/career-semi-quant.git@master#subdirectory=local"
          semiquant publish --out .qt-out
      - name: Add the web edition to the site
        if: always()
        run: |
          if [ -f .qt-out/index.html ]; then
            mkdir -p dist/quant-terminal/app
            cp -r .qt-out/. dist/quant-terminal/app/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Smoke test of exactly what was published: every page loads without script
  # errors, no horizontal overflow at phone / desktop-site / laptop widths in
  # both themes, data bots still fresh, design detector clean. Runs beside the
  # deploy - a red run flags a problem (and emails you), it never blocks it.
  checks:
    needs: build
    # The 15- and 30-minute quant schedules only republish data: no smoke test on those.
    if: github.event_name != 'schedule' || github.event.schedule == '41 */3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unpack the built site
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - run: mkdir -p dist && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist
      - name: Secure sensor model (cipher vectors, calibration, verdict table)
        run: npm run test:sensor
      - name: gm/ID pages match their template (gmid/build_pages.py)
        run: python3 gmid/build_pages.py --check
      - name: Design detector (tools index)
        run: node .agents/skills/impeccable/scripts/detect.mjs --json src/pages src/components src/styles src/layouts
      - run: npx playwright-core install --with-deps --only-shell chromium
      - name: Smoke test
        run: npm run smoke
