name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute deploy URLs
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE="/"
            SITE="https://${OWNER}.github.io"
          else
            BASE="/${REPO}"
            SITE="https://${OWNER}.github.io/${REPO}"
          fi
          # Optional overrides via repository Variables (e.g. custom domain).
          if [ -n "${{ vars.SITE_URL }}" ]; then SITE="${{ vars.SITE_URL }}"; fi
          if [ -n "${{ vars.ASTRO_BASE }}" ]; then BASE="${{ vars.ASTRO_BASE }}"; fi
          echo "SITE_URL=$SITE" >> "$GITHUB_ENV"
          echo "ASTRO_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Building for $SITE (base: $BASE)"

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
