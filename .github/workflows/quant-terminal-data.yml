name: Update quant terminal data

# Refreshes public/quant-terminal/market_data.json (weekly closes + fundamentals
# from Yahoo Finance via yfinance). The page itself is static; this is its only
# data source. Commits made with GITHUB_TOKEN don't trigger other workflows, so
# deploy.yml redeploys via its workflow_run trigger once this finishes.

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC Mon–Fri, after the US close
    - cron: "0 9 * * *"       # 09:00 UTC daily, after Asian markets close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-terminal-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quant-terminal/requirements.txt

      # -U keeps yfinance current: Yahoo changes its API often and stale pins break.
      - run: pip install -U -r quant-terminal/requirements.txt

      # Exits non-zero without writing if most tickers fail, so an outage shows
      # up as a failed run instead of an emptied data file.
      - name: Fetch market data
        run: python quant-terminal/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "quant-terminal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/quant-terminal/market_data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Quant terminal data $(date -u +%F)"
          # Other bots (conference tracker) push to main too; rebase and retry on a race.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Push rejected, rebasing (attempt $i)…"
            sleep $((i * 5))
            git pull --rebase origin main
          done
          exit 1
