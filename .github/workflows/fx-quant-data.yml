name: FX Quant data

# Refreshes public/fx-quant/fx_data.json (ECB euro reference rates for seven
# INR pairs via Frankfurter). The FX Quant Terminal page reads only this file.
# update_fx.py exits non-zero without writing if any pair looks wrong, so an
# outage shows up as a failed run instead of an emptied data file.

on:
  schedule:
    - cron: "20 15 * * 1-5"   # 15:20 UTC Mon-Fri, after the ~16:00 CET ECB fixing
    - cron: "30 20 * * 1-5"   # evening backstop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-quant-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ECB reference rates
        run: python fx-quant/update_fx.py
      - name: Commit
        run: |
          git config user.name "fx-quant[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fx-quant/fx_data.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "FX Quant data $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5)); git pull --rebase
          done
          exit 1
